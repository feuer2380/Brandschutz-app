  document.getElementById('neuerBegehungBtn').onclick = function(){ modalBegehungsberichtBearbeiten(kundeId, null); };
  document.querySelectorAll('[data-begbearbeiten]').forEach(function(b){
    b.onclick = function(){ modalBegehungsberichtBearbeiten(kundeId, b.getAttribute('data-begbearbeiten')); };
  });
  document.querySelectorAll('[data-begloeschen]').forEach(function(b){
    b.onclick = function(){
      var bid = b.getAttribute('data-begloeschen');
      if(!confirm('Diesen Begehungsbericht wirklich löschen?')) return;
      dbDelete('begehungsberichte', bid, function(){
        state.begehungsberichte = state.begehungsberichte.filter(function(x){ return x.id !== bid; });
        modalBegehungsberichtListe(kundeId);
      });
    };
  });
}

function modalBegehungsberichtBearbeiten(kundeId, berichtId){
  var k = state.kunden.filter(function(x){ return x.id === kundeId; })[0];
  if(!k) return;
  var bestehend = berichtId ? state.begehungsberichte.filter(function(x){ return x.id === berichtId; })[0] : null;
  var bericht = bestehend || {
    id: uid(),
    kundeId: kundeId,
    datum: new Date().toISOString().substring(0,10),
    objektBeschreibung: '',
    eintraege: []
  };

  function neuZeichnen(){
    var html = '';
    html += '<div class="modal-head no-print"><h3>Begehungsbericht</h3><button class="close" id="mClose">&times;</button></div>';
    html += '<label>Datum</label><input type="date" id="begDatum" value="' + bericht.datum + '">';
    html += '<label>Projektbeschreibung</label><input type="text" id="begObjekt" value="' + escapeHtml(bericht.objektBeschreibung || '') + '" placeholder="z.B. Brandschutzbegehung vom ...">';

    html += '<div class="section-title" style="margin-top:16px;">Einträge (Tätigkeiten / Mängel)</div>';
    if(bericht.eintraege.length === 0){
      html += '<div class="empty">Noch keine Einträge</div>';
    } else {
      bericht.eintraege.forEach(function(e, idx){
        html += '<div class="card">';
        html += '<div class="row"><h3>' + escapeHtml(e.titel || 'Eintrag') + '</h3><span class="badge ' + (e.istMangel ? 'warn' : 'ok') + '">' + (e.istMangel ? 'Mangel' : 'OK') + '</span></div>';
        if(e.standort) html += '<div class="meta">Standort: ' + escapeHtml(e.standort) + '</div>';
        if(e.beschreibung) html += '<div class="meta">' + escapeHtml(e.beschreibung) + '</div>';
        if(e.massnahme) html += '<div class="meta"><strong>Maßnahme:</strong> ' + escapeHtml(e.massnahme) + '</div>';
        if(e.foto) html += '<img src="' + e.foto + '" style="max-width:160px; border-radius:8px; margin-top:8px; display:block;">';
        html += '<div style="display:flex; gap:8px; margin-top:8px;">';
        html += '<button type="button" class="btn small secondary" data-eintragbearbeiten="' + idx + '">Bearbeiten</button>';
        html += '<button type="button" class="btn small" style="background:#b02a2a; color:#fff;" data-eintragloeschen="' + idx + '">Löschen</button>';
        html += '</div></div>';
      });
    }
    html += '<button type="button" class="btn block secondary" id="neuerEintragBtn" style="margin-top:8px;">+ Eintrag hinzufügen</button>';

    html += '<button type="button" class="btn block" id="begSpeichernBtn" style="margin-top:18px;">Bericht speichern</button>';
    if(bericht.eintraege.length > 0){
      html += '<button type="button" class="btn block secondary" id="begDruckenBtn" style="margin-top:10px;">Drucken / Als PDF teilen</button>';
    }

    openModal(html);
    document.getElementById('mClose').onclick = function(){ modalBegehungsberichtListe(kundeId); };

    document.getElementById('neuerEintragBtn').onclick = function(){
      speichereKopfdaten();
      modalBegehungEintragBearbeiten(kundeId, bericht, null);
    };
    document.querySelectorAll('[data-eintragbearbeiten]').forEach(function(b){
      b.onclick = function(){
        speichereKopfdaten();
        modalBegehungEintragBearbeiten(kundeId, bericht, parseInt(b.getAttribute('data-eintragbearbeiten'), 10));
      };
    });
    document.querySelectorAll('[data-eintragloeschen]').forEach(function(b){
      b.onclick = function(){
        var idx = parseInt(b.getAttribute('data-eintragloeschen'), 10);
        if(!confirm('Diesen Eintrag wirklich löschen?')) return;
        bericht.eintraege.splice(idx, 1);
        neuZeichnen();
      };
    });

    function speichereKopfdaten(){
      bericht.datum = document.getElementById('begDatum').value || bericht.datum;
      bericht.objektBeschreibung = document.getElementById('begObjekt').value.trim();
    }

    document.getElementById('begSpeichernBtn').onclick = function(){
      speichereKopfdaten();
      dbPut('begehungsberichte', bericht, function(){
        var idx = state.begehungsberichte.findIndex(function(x){ return x.id === bericht.id; });
        if(idx === -1) state.begehungsberichte.push(bericht); else state.begehungsberichte[idx] = bericht;
        toast('Begehungsbericht gespeichert');
        modalBegehungsberichtListe(kundeId);
      });
    };

    var druckBtn = document.getElementById('begDruckenBtn');
    if(druckBtn){
      druckBtn.onclick = function(){
        speichereKopfdaten();
        dbPut('begehungsberichte', bericht, function(){
          var pa = document.getElementById('printArea');
          pa.innerHTML = buildBegehungsberichtHtml(bericht, k);
          setTimeout(function(){ window.print(); }, 120);
        });
      };
    }
  }
  neuZeichnen();
}

function modalBegehungEintragBearbeiten(kundeId, bericht, eintragIdx){
  var bestehend = (eintragIdx !== null && eintragIdx !== undefined) ? bericht.eintraege[eintragIdx] : null;
  var eintrag = bestehend ? Object.assign({}, bestehend) : { titel: '', standort: 'Ganzes Gebäude', beschreibung: '', massnahme: '', istMangel: false, foto: null };

  var html = '';
  html += '<div class="modal-head no-print"><h3>' + (bestehend ? 'Eintrag bearbeiten' : 'Neuer Eintrag') + '</h3><button class="close" id="mClose">&times;</button></div>';
  html += '<label>Titel</label><input type="text" id="eTitel" value="' + escapeHtml(eintrag.titel) + '" placeholder="z.B. Überprüfung der Rauchmelder">';
  html += '<label>Standort</label><input type="text" id="eStandort" value="' + escapeHtml(eintrag.standort) + '">';
  html += '<label>Beschreibung</label><textarea id="eBeschreibung" rows="4" placeholder="Was wurde gemacht / festgestellt?">' + escapeHtml(eintrag.beschreibung) + '</textarea>';
  html += '<label>Maßnahme</label><textarea id="eMassnahme" rows="3" placeholder="Empfohlene/erforderliche Maßnahme">' + escapeHtml(eintrag.massnahme) + '</textarea>';
  html += '<label style="margin-top:6px; display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" id="eMangel" style="width:auto;"' + (eintrag.istMangel ? ' checked' : '') + '> Als Mangel kennzeichnen</label>';
  html += '<label style="margin-top:10px;">Foto</label>';
  html += '<input type="file" accept="image/*" id="eFoto">';
  html += '<div id="eFotoVorschau">' + (eintrag.foto ? '<img src="' + eintrag.foto + '" style="max-width:200px; border-radius:8px; margin-top:8px; display:block;">' : '') + '</div>';
  html += '<button type="button" class="btn block" id="eSpeichernBtn" style="margin-top:18px;">Eintrag übernehmen</button>';

  openModal(html);
  document.getElementById('mClose').onclick = function(){
    dbPut('begehungsberichte', bericht, function(){
      var idx = state.begehungsberichte.findIndex(function(x){ return x.id === bericht.id; });
      if(idx === -1) state.begehungsberichte.push(bericht); else state.begehungsberichte[idx] = bericht;
      modalBegehungsberichtBearbeiten(kundeId, bericht.id);
    });
  };

  document.getElementById('eFoto').onchange = function(ev){
    var file = ev.target.files && ev.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      eintrag.foto = reader.result;
      document.getElementById('eFotoVorschau').innerHTML = '<img src="' + eintrag.foto + '" style="max-width:200px; border-radius:8px; margin-top:8px; display:block;">';
    };
    reader.readAsDataURL(file);
  };

  document.getElementById('eSpeichernBtn').onclick = function(){
    eintrag.titel = document.getElementById('eTitel').value.trim() || 'Eintrag';
    eintrag.standort = document.getElementById('eStandort').value.trim();
    eintrag.beschreibung = document.getElementById('eBeschreibung').value.trim();
    eintrag.massnahme = document.getElementById('eMassnahme').value.trim();
    eintrag.istMangel = document.getElementById('eMangel').checked;
    if(eintragIdx !== null && eintragIdx !== undefined){
      bericht.eintraege[eintragIdx] = eintrag;
    } else {
      bericht.eintraege.push(eintrag);
    }
    dbPut('begehungsberichte', bericht, function(){
      var idx = state.begehungsberichte.findIndex(function(x){ return x.id === bericht.id; });
      if(idx === -1) state.begehungsberichte.push(bericht); else state.begehungsberichte[idx] = bericht;
      modalBegehungsberichtBearbeiten(kundeId, bericht.id);
    });
  };
}

function buildBegehungsberichtHtml(bericht, k){
  var html = '';
  html += '<div class="bericht-brief">';
  html += '<div class="pb-kopfzeile">';
  html += '<div class="pb-titel"><h1>Gesamtübersicht</h1><div class="sub">' + fmtDate(bericht.datum) + '</div><div class="sub">' + escapeHtml(k ? (k.objekt || k.name) : '') + '</div></div>';
  html += '<img src="' + LOGO_DATA + '" class="pb-logo">';
  html += '</div>';
  html += '<div class="pb-kundenbox">';
  html += '<div class="knr">Projektadresse</div>';
  html += '<div>' + escapeHtml(k ? (k.objektAdresse || k.adresse || '') : '') + '</div>';
  if(bericht.objektBeschreibung){
    html += '<div class="knr" style="margin-top:8px;">Projektbeschreibung</div>';
    html += '<div>' + escapeHtml(bericht.objektBeschreibung) + '</div>';
  }
  html += '</div>';

  (bericht.eintraege || []).forEach(function(e){
    html += '<div class="pos-karte" style="margin-top:14px;">';
    html += '<div style="font-weight:700; margin-bottom:4px;">Tätigkeitsnachweis: ' + escapeHtml(e.titel) + '</div>';
    if(e.standort) html += '<div class="meta2">Standort: ' + escapeHtml(e.standort) + '</div>';
    if(e.beschreibung) html += '<div style="margin-top:6px;">' + escapeHtml(e.beschreibung).replace(/\n/g, '<br>') + '</div>';
    if(e.massnahme) html += '<div style="margin-top:6px;"><strong>Maßnahme:</strong> ' + escapeHtml(e.massnahme).replace(/\n/g, '<br>') + '</div>';
    html += '<div style="margin-top:6px;"><strong>Status:</strong> ' + (e.istMangel ? 'Mangel festgestellt' : 'Ohne Beanstandung') + '</div>';
    if(e.foto) html += '<img src="' + e.foto + '" style="max-width:260px; border-radius:8px; margin-top:8px; display:block;">';
    html += '</div>';
  });

  html += '<div class="bericht-fuss">' + escapeHtml(k ? k.name : '') + ' &middot; Wolfgang Janiba Brandschutztechnik GmbH &middot; Ketzergasse 299, 2380 Perchtoldsdorf &middot; Tel 0676/305 83 98 &middot; info@loeschtechnik.at &middot; www.brandschutztechnik-janiba.at &middot; Druckdatum: ' + fmtDate(new Date().toISOString()) + '</div>';
  html += '</div>';
  return html;
}


function modalSammelbericht(kundeId){
  var k = state.kunden.filter(function(x){ return x.id === kundeId; })[0];
  if(!k) return;
  var geraeteAlle = state.geraete.filter(function(g){ return g.kundeId === kundeId && !g.ausgeschieden; });
  var geraeteSortiert = geraeteAlle.slice().sort(function(a,b){
    return geraeteSortierVergleich(a, b);
  });

  var auswahl = {};
  geraeteSortiert.forEach(function(g){
    var letzte = letztePruefungFuerGeraet(g.id);
    if(letzte && letzte.ergebnis === 'Reparatur nötig') auswahl[g.id] = 'reparatur';
    else if(letzte && letzte.ergebnis === 'Ausgeschieden') auswahl[g.id] = 'ausscheiden';
    else auswahl[g.id] = 'in_ordnung';
  });

  var einzelErgebnisse = {};
  geraeteSortiert.forEach(function(g){
    if(((g.kategorie || 'Feuerlöscher').trim()) === 'RWA-Anlage'){
      einzelErgebnisse[g.id] = dienstleistungenFuerGeraet('RWA-Anlage', g.typ).map(function(text){ return { text: text, ok: true }; });
    }
  });

  var html = '';
  html += '<div class="modal-head"><h3>Sammelbericht</h3><button class="close" id="mClose">&times;</button></div>';
  html += '<div class="meta" style="margin-bottom:10px;">' + escapeHtml(k.name) + (k.kundennummer ? ' &middot; Nr. ' + escapeHtml(k.kundennummer) : '') + '</div>';
  html += '<label>Prüfbericht-Nr.</label><input id="sbBerichtNr" type="text" value="SB-' + fmtDate(new Date().toISOString()).split('.').reverse().join('') + '">';
  html += '<label style="margin-top:10px;">Prüfdatum für alle Geräte setzen</label>';
  html += '<div class="row" style="gap:8px;"><input type="date" id="sbPruefdatumAlle" style="flex:1; min-width:0;" value="' + new Date().toISOString().substring(0,10) + '"><button type="button" class="btn small secondary" id="sbPruefdatumAlleBtn" style="flex:0 0 auto;">Für alle übernehmen</button></div>';

  if(geraeteSortiert.length === 0){
    html += '<div class="empty">Keine aktiven Geräte bei diesem Kunden</div>';
  } else {
    var katZaehler2 = {};
    geraeteSortiert.forEach(function(g, idx){
      var katKey2 = (g.kategorie || 'Feuerlöscher').trim();
      katZaehler2[katKey2] = (katZaehler2[katKey2] || 0) + 1;
      var katNr2 = g.nr || katZaehler2[katKey2];
      var istRWA = ((g.kategorie || 'Feuerlöscher').trim()) === 'RWA-Anlage';
      var aktErg = auswahl[g.id];
      var letzte = letztePruefungFuerGeraet(g.id);
      var farbe = function(key){ return key === 'in_ordnung' ? 'var(--ok)' : (key === 'reparatur' ? '#c98a1c' : '#c23f12'); };
      var klasse = function(key){ return aktErg === key ? 'btn small sbErgBtn active' : 'btn small secondary sbErgBtn'; };
      var stil = function(key){ return 'flex:1;' + (aktErg === key ? ' background:' + farbe(key) + ';' : ''); };
      html += '<div class="card" data-geraetkarte="' + g.id + '">';
      html += '<div><strong>Nr. ' + katNr2 + ' &middot; ' + escapeHtml(g.typ) + '</strong>' + (g.kategorie && g.kategorie !== 'Feuerlöscher' ? ' <span class="badge blau" style="font-size:9px; padding:1px 6px;">' + escapeHtml(g.kategorie) + '</span>' : '') + '<br><span class="meta">' + escapeHtml(g.standort || '') + (g.baujahr ? ' &middot; Bj. ' + g.baujahr : '') + (g.seriennummer ? ' &middot; SN ' + escapeHtml(g.seriennummer) : '') + '</span></div>';
      if(istRWA){
        html += '<div style="margin-top:10px;">';
        einzelErgebnisse[g.id].forEach(function(d, dIdx){
          html += '<div class="pos-dienst" style="padding:6px 0;"><span class="dname" style="flex:1; padding-right:8px;">' + escapeHtml(d.text) + '</span><button type="button" class="btn small sbDienstBtn" data-gid="' + g.id + '" data-didx="' + dIdx + '" style="background:var(--ok); min-width:78px;">OK</button></div>';
        });
        html += '</div>';
        html += '<label style="margin-top:6px; display:flex; align-items:center; gap:6px; font-weight:400;"><input type="checkbox" class="sbAusscheidenRWA" data-gid="' + g.id + '" style="width:auto;"> Gerät ausscheiden (defekt)</label>';
        html += '<label style="margin-top:6px;">Akkutausch (Datum, falls heute gemacht)</label><input type="date" id="sbAkku_' + g.id + '" value="' + (g.akkuTauschDatum || '') + '">';
      } else {
        html += '<label style="margin-top:6px;">Prüfdatum</label><input type="date" id="sbPruefdatum_' + g.id + '" value="' + (g.letztePruefung || new Date().toISOString().substring(0,10)) + '">';
        html += '<div style="display:flex; gap:6px; margin-top:10px;">';
        html += '<button type="button" class="' + klasse('in_ordnung') + '" data-gid="' + g.id + '" data-erg="in_ordnung" style="' + stil('in_ordnung') + '">In Ordnung</button>';
        html += '<button type="button" class="' + klasse('reparatur') + '" data-gid="' + g.id + '" data-erg="reparatur" style="' + stil('reparatur') + '">Reparatur</button>';
        html += '<button type="button" class="' + klasse('ausscheiden') + '" data-gid="' + g.id + '" data-erg="ausscheiden" style="' + stil('ausscheiden') + '">Ausscheiden</button>';
        html += '</div>';
        if(istFuellKategorie((g.kategorie || 'Feuerlöscher').trim())){
          var fuellLabel = (g.kategorie === 'CO2-Flaschen') ? 'Neufüllung Gasflasche am' : 'Neufüllung Sodawasser am';
          html += '<label style="margin-top:6px;">' + fuellLabel + '</label><input type="date" id="sbAbfuell_' + g.id + '" value="' + (g.abfuelldatum || new Date().toISOString().substring(0,10)) + '">';
        }
        if(((g.kategorie || 'Feuerlöscher').trim()) === 'Brandschutzbegehung'){
          html += '<label style="margin-top:6px;">Mängel</label><textarea id="sbMaengel_' + g.id + '" rows="3" placeholder="Festgestellte Mängel eintragen...">' + escapeHtml(g.maengel || '') + '</textarea>';
        }
      }
      html += '<textarea id="sbNotiz_' + g.id + '" rows="2" placeholder="Notiz zu diesem Gerät (optional)" style="margin-top:8px;">' + (letzte && letzte.bemerkung ? escapeHtml(letzte.bemerkung) : '') + '</textarea>';
      html += '</div>';
    });
  }

  html += '<label style="margin-top:4px;">Allgemeine Bemerkung (optional)</label><textarea id="sbBemerkung" rows="2" placeholder="z.B. Alle Geräte kontrolliert, keine Auffälligkeiten"></textarea>';
  html += '<label style="margin-top:10px;">Unterschrift Kunde</label>';
  html += '<canvas class="sig" id="sbSigKunde"></canvas>';
  html += '<button class="btn secondary small" id="sbSigClearKunde" style="margin-top:6px;">Löschen</button>';
  html += '<label style="margin-top:14px;">Unterschrift Techniker</label>';
  html += '<canvas class="sig" id="sbSigTechniker"></canvas>';
  html += '<button class="btn secondary small" id="sbSigClearTechniker" style="margin-top:6px;">Löschen</button>';
  html += '<button class="btn block" id="sbSpeichern" style="margin-top:16px;">Sammelbericht erstellen</button>';

  openModal(html);
  document.getElementById('mClose').onclick = closeModal;

  var sbPruefdatumAlleBtn = document.getElementById('sbPruefdatumAlleBtn');
  if(sbPruefdatumAlleBtn) sbPruefdatumAlleBtn.onclick = function(){
    var wert = document.getElementById('sbPruefdatumAlle').value;
    if(!wert){ toast('Bitte zuerst ein Datum wählen'); return; }
    document.querySelectorAll('input[id^="sbPruefdatum_"]').forEach(function(inp){
      inp.value = wert;
    });
    toast('Datum für alle Geräte übernommen');
  };

  var sigKunde = initSigPad('sbSigKunde');
  var sigTechniker = initSigPad('sbSigTechniker');
  document.getElementById('sbSigClearKunde').onclick = function(){
    sigKunde.getContext('2d').clearRect(0,0,sigKunde.width,sigKunde.height);
  };
  document.getElementById('sbSigClearTechniker').onclick = function(){
    sigTechniker.getContext('2d').clearRect(0,0,sigTechniker.width,sigTechniker.height);
  };

  document.querySelectorAll('.sbErgBtn').forEach(function(b){
    b.onclick = function(){
      var gid = b.getAttribute('data-gid');
      auswahl[gid] = b.getAttribute('data-erg');
      document.querySelectorAll('.sbErgBtn[data-gid="' + gid + '"]').forEach(function(other){
        other.className = 'btn small secondary sbErgBtn';
        other.style.background = '';
      });
      var farbe = auswahl[gid] === 'in_ordnung' ? 'var(--ok)' : (auswahl[gid] === 'reparatur' ? '#c98a1c' : '#c23f12');
      b.className = 'btn small sbErgBtn active';
      b.style.background = farbe;
    };
  });

  document.querySelectorAll('.sbDienstBtn').forEach(function(b){
    b.onclick = function(){
      var gid = b.getAttribute('data-gid');
      var dIdx = parseInt(b.getAttribute('data-didx'), 10);
      var d = einzelErgebnisse[gid][dIdx];
      d.ok = !d.ok;
      b.textContent = d.ok ? 'OK' : 'nicht OK';
      b.style.background = d.ok ? 'var(--ok)' : '#c23f12';
    };
  });

  document.getElementById('sbSpeichern').onclick = function(){
    var sbBtn = document.getElementById('sbSpeichern');
    sbBtn.disabled = true;
    sbBtn.textContent = 'Wird gespeichert...';
    var fertigMarkiert = false;
    var wachhund = setTimeout(function(){
      if(!fertigMarkiert){
        sbBtn.disabled = false;
        sbBtn.textContent = 'Sammelbericht erstellen';
        toast('Das Speichern dauert ungewöhnlich lange oder ist hängen geblieben. Bitte Internetverbindung prüfen und nochmal versuchen.');
      }
    }, 20000);

    var jetztIso = new Date().toISOString();
    var idx = 0;
    var snapshot = [];

    function naechstesGeraet(){
      sbBtn.textContent = 'Speichere Gerät ' + (idx + 1) + ' von ' + geraeteSortiert.length + '...';
      if(idx >= geraeteSortiert.length){
        sbBtn.textContent = 'Erstelle Bericht(e)...';
        var basisNr = document.getElementById('sbBerichtNr').value.trim();
        var allgemeineBemerkung = document.getElementById('sbBemerkung').value.trim();
        var sigKundeData = sigKunde.toDataURL('image/png');
        var sigTechnikerData = sigTechniker.toDataURL('image/png');

        var gruppenNachKategorie = {};
        var kategorienReihenfolge = [];
        snapshot.forEach(function(g){
          var kat = (g.kategorie || 'Feuerlöscher').trim();
          if(!gruppenNachKategorie[kat]){
            gruppenNachKategorie[kat] = [];
            kategorienReihenfolge.push(kat);
          }
          gruppenNachKategorie[kat].push(g);
        });

        var berichteZuSpeichern = kategorienReihenfolge.map(function(kat, katIdx){
          var geraeteNeuNummeriert = gruppenNachKategorie[kat].map(function(g, i){
            var kopie = {};
            for(var key in g){ kopie[key] = g[key]; }
            kopie.nr = g.nr || (i + 1);
            return kopie;
          });
          return {
            id: uid(),
            kundeId: kundeId,
            datum: jetztIso,
            berichtNr: basisNr + (kategorienReihenfolge.length > 1 ? '-' + (katIdx+1) : ''),
            geraeteSnapshot: geraeteNeuNummeriert,
            bemerkung: allgemeineBemerkung,
            unterschriftKunde: sigKundeData,
            unterschriftTechniker: sigTechnikerData
          };
        });

        var bi = 0;
        function speichereNaechstenBericht(){
          if(bi >= berichteZuSpeichern.length){
            fertigMarkiert = true;
            loadAll(function(){ state.tab = 'berichte'; render(); closeModal(); toast(berichteZuSpeichern.length + ' Prüfbericht(e) erstellt'); });
            return;
          }
          dbPut('sammelberichte', berichteZuSpeichern[bi], function(){
            bi++;
            speichereNaechstenBericht();
          });
        }
        speichereNaechstenBericht();
        return;
      }
      var g = geraeteSortiert[idx];
      var istRWA = ((g.kategorie || 'Feuerlöscher').trim()) === 'RWA-Anlage';
      var akkuEl = istRWA ? document.getElementById('sbAkku_' + g.id) : null;
      var akkuVal = akkuEl ? akkuEl.value : '';
      if(akkuVal){ g.akkuTauschDatum = akkuVal; }
      var istPZ = istFuellKategorie((g.kategorie || 'Feuerlöscher').trim());
      var abfuellEl = istPZ ? document.getElementById('sbAbfuell_' + g.id) : null;
      var abfuellVal = abfuellEl ? abfuellEl.value : '';
      if(abfuellVal){
        var jetzt = new Date();
        var hh = jetzt.getHours(); if(hh<10) hh = '0'+hh;
        var mm = jetzt.getMinutes(); if(mm<10) mm = '0'+mm;
        g.abfuelldatum = abfuellVal + 'T' + hh + ':' + mm;
        if(!g.fuellungen) g.fuellungen = [];
        var mengeInfo = mengeAusTyp(g.typ, g.kategorie);
        g.fuellungen.push({ datum: g.abfuelldatum, menge: mengeInfo.wert, einheit: mengeInfo.einheit, standort: g.standort || '' });
      }
      var istBegehung = ((g.kategorie || 'Feuerlöscher').trim()) === 'Brandschutzbegehung';
      var maengelEl = istBegehung ? document.getElementById('sbMaengel_' + g.id) : null;
      var maengelVal = maengelEl ? maengelEl.value.trim() : '';
      if(maengelEl){ g.maengel = maengelVal; }
      var ergebnis;
      if(istRWA){
        var ausscheidenBox = document.querySelector('.sbAusscheidenRWA[data-gid="' + g.id + '"]');
        if(ausscheidenBox && ausscheidenBox.checked){
          ergebnis = 'ausscheiden';
        } else {
          var alleOk = einzelErgebnisse[g.id].every(function(d){ return d.ok; });
          ergebnis = alleOk ? 'in_ordnung' : 'reparatur';
        }
      } else {
        ergebnis = auswahl[g.id] || 'in_ordnung';
      }
      var ergebnisLabel = ergebnis === 'in_ordnung' ? 'In Ordnung' : (ergebnis === 'reparatur' ? 'Reparatur nötig' : 'Ausgeschieden');
      var notiz = (document.getElementById('sbNotiz_' + g.id).value || '').trim();

      var pruefdatumElVorab = document.getElementById('sbPruefdatum_' + g.id);
      var pruefdatumWertVorab = (ergebnis === 'in_ordnung' && pruefdatumElVorab && pruefdatumElVorab.value) ? pruefdatumElVorab.value : null;
      var istRueckwirkendSb = pruefdatumWertVorab && pruefdatumWertVorab !== jetztIso.substring(0,10);
      var erledigtAmWert = istRueckwirkendSb ? (pruefdatumWertVorab + 'T12:00:00') : jetztIso;

      var offenePruefung = state.pruefungen.filter(function(p){ return p.geraetId === g.id && !p.erledigt; })[0];
      if(!offenePruefung){
        offenePruefung = { id: uid(), kundeId: kundeId, geraetId: g.id, typ: g.typ, datum: erledigtAmWert.substring(0,10), erledigt: false };
      }
      offenePruefung.erledigt = true;
      offenePruefung.erledigtAm = erledigtAmWert;
      offenePruefung.erledigtVon = (state.rolle === 'chef' ? 'Chef' : (state.mitarbeiterName || 'Mitarbeiter'));
      offenePruefung.bericht = true;
      offenePruefung.ergebnis = ergebnisLabel;
      offenePruefung.bemerkung = notiz;
      offenePruefung.unterschriftKunde = sigKunde.toDataURL('image/png');
      offenePruefung.unterschriftTechniker = sigTechniker.toDataURL('image/png');

      dbPut('pruefungen', offenePruefung, function(){
        var weiter = function(naechstePruefungWert){
          var bjSnap = (istInnenrevisionspflichtig(g) ? baujahrStatus(g.baujahr, g.letzteInnenrevision) : null);
          snapshot.push({
            nr: g.nr || (idx + 1),
            typ: g.typ,
            kategorie: (g.kategorie || 'Feuerlöscher').trim(),
            standort: g.standort || '',
            baujahr: g.baujahr || null,
            seriennummer: g.seriennummer || '',
            abfuelldatum: g.abfuelldatum || null,
            ergebnis: ergebnisLabel,
            notiz: notiz,
            naechstePruefung: naechstePruefungWert || null,
            letztePruefung: g.letztePruefung || null,
            innenrevision: bjSnap ? bjSnap.label : null,
            letzteInnenrevision: g.letzteInnenrevision || null,
            akkuTausch: akkuVal || null,
            maengel: g.maengel || null,
            dienstErgebnisse: istRWA ? einzelErgebnisse[g.id].map(function(d){ return { text: d.text, ok: d.ok }; }) : null
          });
          idx++;
          naechstesGeraet();
        };
        if(ergebnis === 'ausscheiden'){
          g.ausgeschieden = true;
          g.ausgeschiedenAm = jetztIso;
          dbPut('geraete', g, function(){ weiter(null); });
        } else if(ergebnis === 'in_ordnung'){
          var pruefdatumWert = pruefdatumWertVorab || jetztIso.substring(0,10);
          g.letztePruefung = pruefdatumWert;
          g.naechstePruefung = naechsterTerminBeiAbschluss(g, pruefdatumWert + 'T12:00:00');
          dbPut('geraete', g, function(){ neuenOffenenTerminAnlegen(g, function(){ weiter(g.naechstePruefung); }); });
        } else if(akkuVal || abfuellVal || maengelEl){
          dbPut('geraete', g, function(){ weiter(g.naechstePruefung); });
        } else {
          weiter(g.naechstePruefung);
        }
      });
    }
    try {
      naechstesGeraet();
    } catch(err){
      clearTimeout(wachhund);
      sbBtn.disabled = false;
      sbBtn.textContent = 'Sammelbericht erstellen';
      console.error('Sammelbericht-Fehler', err);
      toast('Fehler beim Erstellen: ' + (err && err.message ? err.message : err));
    }
  };
}

function buildSammelberichtHtml(sb, k){
  var html = '';
  var berichtNr = sb.berichtNr || ('SB-' + fmtDate(sb.datum).split('.').reverse().join('') + '-' + sb.id.slice(-4));
  html += '<div class="bericht-brief">';

  var gruppenNachKategorie = {};
  var kategorienReihenfolge = [];
  (sb.geraeteSnapshot || []).forEach(function(g){
    var kat = (g.kategorie || 'Feuerlöscher').trim();
    if(!gruppenNachKategorie[kat]){
      gruppenNachKategorie[kat] = [];
      kategorienReihenfolge.push(kat);
    }
    gruppenNachKategorie[kat].push(g);
  });

  kategorienReihenfolge.forEach(function(kat, katIdx){
    var geraeteDerKategorie = gruppenNachKategorie[kat];
    var normText = normFuerKategorie(kat);
    var unterNr = berichtNr + (kategorienReihenfolge.length > 1 ? '-' + (katIdx+1) : '');

    if(katIdx > 0) html += '<div style="page-break-before:always;"></div>';

    html += '<div class="pb-kopfzeile">';
    html += '<div class="pb-titel"><h1>Prüfergebnisbericht</h1><div class="sub">Prüfbericht ' + escapeHtml(kat) + '</div>' + (normText ? '<div class="norm">' + escapeHtml(normText) + '</div>' : '') + '</div>';
    html += '<img src="' + (istFuellKategorie(kat) ? LOGO_DATA_PZ : LOGO_DATA) + '" class="pb-logo">';
    html += '</div>';
    html += '<div class="pb-berichtnr">Prüfbericht Nr.: ' + unterNr + '</div>';

    if(k && k.objekt){
      html += '<div class="pb-kundenreihe">';
      html += '<div class="pb-kundenbox">';
      html += '<div class="knr">Kunde' + (k.kundennummer ? ' Nr. ' + escapeHtml(k.kundennummer) : '') + '</div>';
      html += '<div style="font-weight:700; margin:2px 0;">' + escapeHtml(k.name) + '</div>';
      html += '<div>' + escapeHtml(k.adresse||'') + '</div>';
      html += '</div>';
      html += '<div class="pb-kundenbox objektbox">';
      html += '<div class="knr">Objekt</div>';
      html += '<div style="font-weight:700; margin:2px 0;">' + escapeHtml(k.objekt) + '</div>';
      html += '<div>' + escapeHtml(k.objektAdresse || k.adresse || '') + '</div>';
      html += '</div>';
      html += '</div>';
    } else {
      html += '<div class="pb-kundenbox">';
      html += '<div class="knr">Kunde' + (k && k.kundennummer ? ' Nr. ' + escapeHtml(k.kundennummer) : '') + '</div>';
      html += '<div style="font-weight:700; margin:2px 0;">' + (k ? escapeHtml(k.name) : '-') + '</div>';
      html += '<div>' + (k ? escapeHtml(k.adresse||'') : '') + '</div>';
      html += '</div>';
    }

    geraeteDerKategorie.forEach(function(g){
      var ei = ergebnisInfo(g.ergebnis);
      var istOk = g.ergebnis === 'In Ordnung';
      html += '<div class="pos-karte">';
      html += '<div class="pos-kopf">';
      html += '<div><div class="titel">' + g.nr + '. ' + escapeHtml(g.typ) + '</div>';
      html += '<div class="meta2">' + escapeHtml(g.standort||'-') + (g.seriennummer ? ' &middot; SN ' + escapeHtml(g.seriennummer) : '') + (g.baujahr ? ' &middot; Bj. ' + g.baujahr : '') + '</div></div>';
      var naechsteGueltig = g.naechstePruefung && new Date(g.naechstePruefung) > new Date(sb.datum);
      if(istFuellKategorie(kat)){
        html += '<div class="rechts">Neufüllung am<br><strong>' + fmtDatumZeitLokal(g.abfuelldatum) + '</strong></div>';
      } else {
        html += '<div class="rechts">Prüfdatum<br><strong>' + fmtDate(g.letztePruefung || sb.datum) + '</strong><br>nä. Prüfung (KW/Jahr)<br><strong>' + (naechsteGueltig ? fmtKW(g.naechstePruefung) : '-') + '</strong></div>';
      }
      html += '</div>';
      if(g.dienstErgebnisse && g.dienstErgebnisse.length){
        g.dienstErgebnisse.forEach(function(d){
          var dOk = d.ok !== false;
          html += '<div class="pos-dienst"><span class="dname">' + escapeHtml(d.text) + '</span><span class="' + (dOk ? 'pb-ok' : 'pb-rot') + '">Ergebnis: ' + (dOk ? 'OK' : 'nicht OK') + '</span></div>';
        });
      } else if(istFuellKategorie(kat)){
        var neufuellPrefix = (kat === 'CO2-Flaschen') ? 'Neufüllung Gasflasche am ' : 'Neufüllung Sodawasser am ';
        var neufuellText = neufuellPrefix + (g.abfuelldatum ? fmtDatumZeitLokal(g.abfuelldatum) : fmtDate(sb.datum));
        html += '<div class="pos-dienst"><span class="dname">' + escapeHtml(neufuellText) + '</span><span class="' + ei.cls + '">Ergebnis: ' + (istOk ? 'OK' : escapeHtml(ei.label)) + '</span></div>';
      } else {
        var dienste = dienstleistungenFuer(kat);
        dienste.forEach(function(dName){
          html += '<div class="pos-dienst"><span class="dname">' + escapeHtml(dName) + '</span><span class="' + ei.cls + '">Ergebnis: ' + (istOk ? 'OK' : escapeHtml(ei.label)) + '</span></div>';
        });
      }
      if(g.akkuTausch){
        html += '<div class="pos-dienst"><span class="dname">Ersatzteil: Akku inkl. Montage und Entsorgung</span><span class="meta2">Akkutausch: ' + fmtDate(g.akkuTausch) + '</span></div>';
      }
      if(g.maengel){
        html += '<div class="pos-notiz"><strong>Festgestellte Mängel:</strong> ' + escapeHtml(g.maengel) + '</div>';
      }
      if(g.notiz){
        html += '<div class="pos-notiz"><strong>Bemerkung:</strong> ' + escapeHtml(g.notiz) + '</div>';
      }
      html += '</div>';
    });

    html += '<div class="bericht-fuss">' + escapeHtml(unterNr) + ' &middot; Wolfgang Janiba Brandschutztechnik GmbH &middot; Ketzergasse 299, 2380 Perchtoldsdorf &middot; Tel 0676/305 83 98 &middot; info@loeschtechnik.at &middot; www.brandschutztechnik-janiba.at &middot; Druckdatum: ' + fmtDate(new Date().toISOString()) + '</div>';
  });

  if(sb.bemerkung){
    html += '<div class="bericht-feld" style="margin-top:16px;"><div class="l">Allgemeine Bemerkungen</div><div class="w">' + escapeHtml(sb.bemerkung) + '</div></div>';
  }

  html += '<div class="pb-sig-row">';
  html += '<div class="pb-sig-col">';
  if(sb.unterschriftTechniker) html += '<img src="' + sb.unterschriftTechniker + '">';
  else html += '<div style="height:60px;"></div>';
  html += '<div class="sig-label">Unterschrift Techniker</div>';
  html += '</div>';
  html += '<div class="pb-sig-col">';
  if(sb.unterschriftKunde) html += '<img src="' + sb.unterschriftKunde + '">';
  else html += '<div style="height:60px;"></div>';
  html += '<div class="sig-label">Unterschrift Kunde' + (k ? ' (' + escapeHtml(k.name) + ')' : '') + '</div>';
  html += '</div>';
  html += '</div>';

  html += '</div>';
  return html;
}

function modalSammelberichtAnsicht(sbId){
  var sb = state.sammelberichte.filter(function(x){ return x.id === sbId; })[0];
  if(!sb) return;
  var k = state.kunden.filter(function(x){ return x.id === sb.kundeId; })[0];
  var html = '';
  html += '<div class="modal-head no-print"><h3>Sammelbericht</h3><button class="close" id="mClose">&times;</button></div>';
  html += '<div class="no-print" style="margin-bottom:10px;"><label>Prüfbericht-Nr.</label><input id="sbNrBearbeiten" type="text" value="' + escapeHtml(sb.berichtNr || '') + '"><button class="btn small secondary" id="sbNrSpeichern">Nummer speichern</button></div>';
  html += buildSammelberichtHtml(sb, k);
  html += '<div class="no-print" style="margin-top:16px;">';
  html += '<button class="btn block" id="druckBtnSb">Drucken / Als PDF teilen</button>';
  html += '<button class="btn block secondary" id="mailBtnSb" style="margin-top:10px;">Per E-Mail senden</button>';
  html += '<div class="meta" style="margin-top:4px;">Nur Text-Zusammenfassung. Fuer die formatierte Version wie beim Drucken: Drucken / Als PDF teilen -&gt; Teilen-Symbol -&gt; Mail.</div>';
  html += '</div>';
  openModal(html);
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('sbNrSpeichern').onclick = function(){
    sb.berichtNr = document.getElementById('sbNrBearbeiten').value.trim();
    dbPut('sammelberichte', sb, function(){
      loadAll(function(){ toast('Nummer gespeichert'); modalSammelberichtAnsicht(sbId); });
    });
  };
  document.getElementById('druckBtnSb').onclick = function(){
    var druckBtnSbEl = document.getElementById('druckBtnSb');
    druckBtnSbEl.disabled = true;
    druckBtnSbEl.textContent = 'Bereite vor...';
    try {
      var pa = document.getElementById('printArea');
      pa.innerHTML = buildSammelberichtHtml(sb, k);
      var anzahlGeraete = (sb.geraeteSnapshot || []).length;
      var wartezeit = Math.min(120 + anzahlGeraete * 15, 3000);
      setTimeout(function(){
        druckBtnSbEl.disabled = false;
        druckBtnSbEl.textContent = 'Drucken / Als PDF teilen';
        window.print();
      }, wartezeit);
    } catch(err){
      druckBtnSbEl.disabled = false;
      druckBtnSbEl.textContent = 'Drucken / Als PDF teilen';
      console.error('Druck-Fehler Sammelbericht', err);
      toast('Fehler beim Vorbereiten des Drucks: ' + (err && err.message ? err.message : err));
    }
  };
  document.getElementById('mailBtnSb').onclick = function(){
    var betreff = 'Sammelbericht ' + (k ? k.name : '') + ' - ' + fmtDate(sb.datum);
    var zeilen = [];
    zeilen.push('Sammelbericht');
    zeilen.push('Kunde: ' + (k ? k.name : '-'));
    zeilen.push('Adresse: ' + (k ? (k.adresse||'-') : '-'));
    zeilen.push('Datum: ' + fmtDate(sb.datum));
    zeilen.push('');
    (sb.geraeteSnapshot || []).forEach(function(g){
      zeilen.push('Nr. ' + g.nr + ' - ' + g.typ + ' (' + g.ergebnis + ')' + (g.notiz ? ' - ' + g.notiz : ''));
    });
    zeilen.push('');
    zeilen.push('Wolfgang Janiba Brandschutztechnik GmbH, Ketzergasse 299, 2380 Perchtoldsdorf, Tel 0676/305 83 98');
    var text = zeilen.join('\n');
    var mailto = 'mailto:?subject=' + encodeURIComponent(betreff) + '&body=' + encodeURIComponent(text);
    window.location.href = mailto;
  };
}

  document.querySelectorAll('.alleGeraeteDruckBtn').forEach(function(el){
    el.onclick = function(e){
      e.stopPropagation();
      modalGeraeteuebersicht(el.getAttribute('data-kid'));
    };
  });

  var back = document.getElementById('backToKunden');
  if(back) back.onclick = function(){ state.tab = 'kunden'; render(); };

  var backScan = document.getElementById('backToScan');
  if(backScan) backScan.onclick = function(){ state.vorgewaehltesErgebnis = null; state.tab = 'scan'; render(); };

  var scanManuellBtn = document.getElementById('scanManuellBtn');
  var checkSigKundeCanvas = initSigPad('checkSigKunde');
  var checkSigTechnikerCanvas = initSigPad('checkSigTechniker');
  if(checkSigKundeCanvas){
    var checkSigClearKunde = document.getElementById('checkSigClearKunde');
    if(checkSigClearKunde) checkSigClearKunde.onclick = function(){
      checkSigKundeCanvas.getContext('2d').clearRect(0,0,checkSigKundeCanvas.width,checkSigKundeCanvas.height);
    };
  }
  if(checkSigTechnikerCanvas){
    var checkSigClearTechniker = document.getElementById('checkSigClearTechniker');
    if(checkSigClearTechniker) checkSigClearTechniker.onclick = function(){
      checkSigTechnikerCanvas.getContext('2d').clearRect(0,0,checkSigTechnikerCanvas.width,checkSigTechnikerCanvas.height);
    };
  }

  var checkInnenrevErledigt = document.getElementById('checkInnenrevErledigt');
  if(checkInnenrevErledigt){
    checkInnenrevErledigt.onclick = function(){
      customConfirm('Innenrevision für dieses Gerät jetzt als heute durchgeführt markieren?', function(){
        var g = state.geraete.filter(function(x){ return x.id === state.activeGeraetId; })[0];
        if(g){
          g.letzteInnenrevision = new Date().toISOString().substring(0,10);
          dbPut('geraete', g, function(){
            loadAll(function(){ render(); toast('Innenrevision vermerkt'); });
          });
        }
      });
    };
  }

  var btnOk = document.getElementById('btnOk');
  if(btnOk) btnOk.onclick = function(){ checkAbschliessen(state.activeGeraetId, 'in_ordnung'); };
  var btnSchnellOk = document.getElementById('btnSchnellOk');
  if(btnSchnellOk) btnSchnellOk.onclick = function(){ checkAbschliessen(state.activeGeraetId, 'in_ordnung'); };
  var btnReparatur = document.getElementById('btnReparatur');
  if(btnReparatur) btnReparatur.onclick = function(){ checkAbschliessen(state.activeGeraetId, 'reparatur'); };

  var btnBegehungStarten = document.getElementById('btnBegehungStarten');
  if(btnBegehungStarten){
    btnBegehungStarten.onclick = function(){
      var g = state.geraete.filter(function(x){ return x.id === state.activeGeraetId; })[0];
      if(!g) return;
      g.begehungStart = new Date().toISOString();
      dbPut('geraete', g, function(){
        loadAll(function(){ render(); toast('Begehung gestartet um ' + fmtZeit(g.begehungStart) + ' Uhr'); });
      });
    };
  }
  var btnBegehungBeenden = document.getElementById('btnBegehungBeenden');
  if(btnBegehungBeenden) btnBegehungBeenden.onclick = function(){ checkAbschliessen(state.activeGeraetId, 'begehung'); };

  var btnAusscheiden = document.getElementById('btnAusscheiden');
  if(btnAusscheiden){
    btnAusscheiden.onclick = function(){
      customConfirm('Gerät wirklich als ausgeschieden markieren?', function(){
        checkAbschliessen(state.activeGeraetId, 'ausscheiden');
      });
    };
  }

  var logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = function(){ state.rolle = null; state.mitarbeiterName = null; state.tab = 'dashboard'; render(); };

  var addGeraet = document.getElementById('addGeraetBtn');
  if(addGeraet) addGeraet.onclick = function(){ modalNeuesGeraet(state.activeKundeId); };

  var geraeteKatFilterEl = document.getElementById('geraeteKatFilter');
  if(geraeteKatFilterEl) geraeteKatFilterEl.onchange = function(){
    state.kundeGeraeteKatFilter = geraeteKatFilterEl.value || null;
    render();
  };

  var druckBtnStat = document.getElementById('druckBtnStat');
  if(druckBtnStat) druckBtnStat.onclick = function(){
    var pa = document.getElementById('printArea');
    pa.innerHTML = buildStatistikDruckHtml(state.statFilter || 'tag');
    setTimeout(function(){ window.print(); }, 120);
  };

  var tagesprotokollDatumInput = document.getElementById('tagesprotokollDatum');
  if(tagesprotokollDatumInput) tagesprotokollDatumInput.onchange = function(){
    state.tagesprotokollDatum = tagesprotokollDatumInput.value;
    render();
  };

  document.querySelectorAll('.lager-card').forEach(function(c){
    c.onclick = function(){ modalLagerArtikelAnpassen(c.getAttribute('data-id')); };
  });
  document.querySelectorAll('[data-lagerminus]').forEach(function(b){
    b.onclick = function(e){ e.stopPropagation(); lagerBestandAendern(b.getAttribute('data-lagerminus'), -1); };
  });
  document.querySelectorAll('[data-lagerplus]').forEach(function(b){
    b.onclick = function(e){ e.stopPropagation(); lagerBestandAendern(b.getAttribute('data-lagerplus'), 1); };
  });
  document.querySelectorAll('[data-lagerqr]').forEach(function(b){
    b.onclick = function(e){ e.stopPropagation(); modalQrLagerartikel(b.getAttribute('data-lagerqr')); };
  });
  var lagerstandDruckenBtn = document.getElementById('lagerstandDruckenBtn');
  if(lagerstandDruckenBtn) lagerstandDruckenBtn.onclick = function(){
    var pa = document.getElementById('printArea');
    pa.innerHTML = buildLagerstandDruckHtml();
    setTimeout(function(){ window.print(); }, 120);
  };

  var alleLagerQrBtn = document.getElementById('alleLagerQrDruckenBtn');
  if(alleLagerQrBtn) alleLagerQrBtn.onclick = function(){
    var res = buildAlleLagerQrDruckHtml();
    if(res.liste.length === 0){ toast('Keine Lagerartikel vorhanden'); return; }
    var pa = document.getElementById('printArea');
    pa.innerHTML = res.html;
    res.liste.forEach(function(a){
      try{
        new QRCode(document.getElementById('druckqr_' + a.id), {
          text: 'BSV-LAGER:' + a.id,
          width: 140,
          height: 140,
          correctLevel: QRCode.CorrectLevel.M
        });
      } catch(e){}
    });
    setTimeout(function(){ window.print(); }, 150);
  };

  document.querySelectorAll('.filter-btn').forEach(function(b){
    b.onclick = function(){
      if(b.hasAttribute('data-geraetefilter')){
        state.geraeteFilter = b.getAttribute('data-geraetefilter');
      } else if(b.hasAttribute('data-statfilter')){
        state.statFilter = b.getAttribute('data-statfilter');
      } else if(b.hasAttribute('data-statsubtab')){
        state.statSubTab = b.getAttribute('data-statsubtab');
      } else {
        state.pruefungFilter = b.getAttribute('data-filter');
      }
      render();
    };
  });

  var statKundenSucheInput = document.getElementById('statKundenSuche');
  if(statKundenSucheInput){
    statKundenSucheInput.oninput = function(){
      state.statSuchtext = statKundenSucheInput.value;
      render();
      var neuesFeld = document.getElementById('statKundenSuche');
      if(neuesFeld){ neuesFeld.focus(); neuesFeld.setSelectionRange(neuesFeld.value.length, neuesFeld.value.length); }
    };
  }

  var exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.onclick = exportAlleDaten;

  var importBtn = document.getElementById('importBtn');
  var importFile = document.getElementById('importFile');
  if(importBtn && importFile){
    importBtn.onclick = function(){ importFile.click(); };
    importFile.onchange = function(){
      if(importFile.files && importFile.files[0]){
        customConfirm('Backup einspielen? Vorhandene Eintraege mit gleicher ID werden ueberschrieben, alles andere bleibt erhalten.', function(){
          importAlleDaten(importFile.files[0]);
        });
      }
    };
  }

  var editKunde = document.getElementById('editKundeBtn');
  if(editKunde) editKunde.onclick = function(){ modalKundeBearbeiten(state.activeKundeId); };

  var kundeStilllegen = document.getElementById('kundeStilllegenBtn');
  if(kundeStilllegen) kundeStilllegen.onclick = function(){
    customConfirm('Kunde stilllegen? Er bleibt erhalten und sichtbar, taucht aber in keiner Erinnerung/Fälligkeitsliste mehr auf, bis du ihn wieder aktivierst.', function(){
      var k = state.kunden.filter(function(x){ return x.id === state.activeKundeId; })[0];
      if(!k) return;
      k.stillgelegt = true;
      k.stillgelegtAm = new Date().toISOString();
      dbPut('kunden', k, function(){
        loadAll(function(){ render(); toast('Kunde stillgelegt'); });
      });
    });
  };

  var kundeAktivieren = document.getElementById('kundeAktivierenBtn');
  if(kundeAktivieren) kundeAktivieren.onclick = function(){
    var k = state.kunden.filter(function(x){ return x.id === state.activeKundeId; })[0];
    if(!k) return;
    k.stillgelegt = false;
    k.stillgelegtAm = null;
    dbPut('kunden', k, function(){
      loadAll(function(){ render(); toast('Kunde wieder aktiviert'); });
    });
  };

  var pruefungenVerschieben = document.getElementById('pruefungenVerschiebenBtn');
  if(pruefungenVerschieben) pruefungenVerschieben.onclick = function(){ modalPruefungenVerschieben(state.activeKundeId); };

  var erweiterteToggle = document.getElementById('erweiterteWerkzeugeToggle');
  if(erweiterteToggle) erweiterteToggle.onclick = function(){
    state.kundeWerkzeugeOffen = !state.kundeWerkzeugeOffen;
    render();
  };

  var pruefungenKorrigieren = document.getElementById('pruefungenKorrigierenBtn');
  if(pruefungenKorrigieren) pruefungenKorrigieren.onclick = function(){ modalPruefungenKorrigieren(state.activeKundeId); };

  var fehlendeTermine = document.getElementById('fehlendeTermineBtn');
  if(fehlendeTermine) fehlendeTermine.onclick = function(){ fehlendeTermineNachtragen(state.activeKundeId); };

  var doppelteTermine = document.getElementById('doppelteTermineBtn');
  if(doppelteTermine) doppelteTermine.onclick = function(){ doppelteTermineBereinigen(state.activeKundeId); };

  var nummernReparieren = document.getElementById('nummernReparierenBtn');
  if(nummernReparieren) nummernReparieren.onclick = function(){ nummernNeuOrdnen(state.activeKundeId); };

  document.querySelectorAll('.device-item').forEach(function(d){
    d.onclick = function(){ modalGeraetBearbeiten(d.getAttribute('data-gid')); };
  });

  document.querySelectorAll('.qrGeraetInlineBtn').forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      modalQrGeraet(b.getAttribute('data-gid'));
    };
  });

  document.querySelectorAll('.schnellDatumInput').forEach(function(inp){
    inp.onchange = function(){
      if(!state.schnellDatumWerte) state.schnellDatumWerte = {};
      state.schnellDatumWerte[inp.getAttribute('data-gid')] = inp.value;
    };
  });

  document.querySelectorAll('.nurTerminBtn').forEach(function(el){
    el.onclick = function(){
      var gid = el.getAttribute('data-gid');
      var datumInput = document.querySelector('.schnellDatumInput[data-gid="' + gid + '"]');
      nurTerminVerschieben(gid, datumInput ? datumInput.value : null);
    };
  });

  document.querySelectorAll('[data-schnellcheck]').forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      var gid = b.getAttribute('data-schnellcheck');
      var erg = b.getAttribute('data-erg');
      var datumInput = document.querySelector('.schnellDatumInput[data-gid="' + gid + '"]');
      var datumOverride = datumInput ? datumInput.value : null;
      if(state.schnellDatumWerte) delete state.schnellDatumWerte[gid];
      schnellErgebnisSetzen(gid, erg, datumOverride);
    };
  });

  document.querySelectorAll('[data-maengelbtn]').forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      modalGeraetBearbeiten(b.getAttribute('data-maengelbtn'));
    };
  });

  var sammelberichtBtn = document.getElementById('sammelberichtBtn');
  if(sammelberichtBtn) sammelberichtBtn.onclick = function(){ modalSammelbericht(state.activeKundeId); };

  var begehungsberichtBtn = document.getElementById('begehungsberichtBtn');
  if(begehungsberichtBtn) begehungsberichtBtn.onclick = function(){ modalBegehungsberichtListe(state.activeKundeId); };

  var dokumenteBtn = document.getElementById('dokumenteBtn');
  if(dokumenteBtn) dokumenteBtn.onclick = function(){ modalDokumenteListe(state.activeKundeId); };

  var fuellhistorieKundeBtn = document.getElementById('fuellhistorieKundeBtn');
  if(fuellhistorieKundeBtn) fuellhistorieKundeBtn.onclick = function(){ modalFuellhistorieListe(state.activeKundeId); };

  var ausstattungBtn = document.getElementById('ausstattungBtn');
  if(ausstattungBtn) ausstattungBtn.onclick = function(){ modalGeraeteuebersicht(state.activeKundeId); };

  var qrBtn = document.getElementById('qrKundeBtn');
  if(qrBtn) qrBtn.onclick = function(){ modalQrKunde(state.activeKundeId); };

  document.querySelectorAll('.erledigtBtn').forEach(function(b){
    b.onclick = function(){ modalErledigt(b.getAttribute('data-pid')); };
  });

  var terminlisteBtn = document.getElementById('terminlisteBtn');
  if(terminlisteBtn) terminlisteBtn.onclick = modalTerminliste;

  document.querySelectorAll('.ausgeschiedenLoeschenBtn').forEach(function(b){
    b.onclick = function(){
      var gid = b.getAttribute('data-gid');
      customConfirm('Dieses ausgeschiedene Gerät unwiderruflich löschen?', function(){
        dbDelete('geraete', gid, function(){
          loadAll(function(){ render(); toast('Gerät gelöscht'); });
        });
      });
    };
  });

  document.querySelectorAll('.pruefungLoeschenBtn').forEach(function(b){
    b.onclick = function(){
      var pid = b.getAttribute('data-pid');
      customConfirm('Diese Prüfung wirklich löschen? Das entfernt nur den Termin, das Gerät bleibt bestehen.', function(){
        dbDelete('pruefungen', pid, function(){
          loadAll(function(){ render(); toast('Prüfung gelöscht'); });
        });
      });
    };
  });

  document.querySelectorAll('[data-erneutpruefen]').forEach(function(b){
    b.onclick = function(){
      var gid = b.getAttribute('data-erneutpruefen');
      var g = state.geraete.filter(function(x){ return x.id === gid; })[0];
      if(!g){ toast('Gerät nicht gefunden'); return; }
      state.activeGeraetId = gid;
      state.checkRueckkehrZuKunde = null;
      state.tab = 'geraetCheck';
      render();
    };
  });

  document.querySelectorAll('[data-viewbericht]').forEach(function(b){
    b.onclick = function(){ modalBerichtAnsicht(b.getAttribute('data-viewbericht')); };
  });

  document.querySelectorAll('[data-viewsammelbericht]').forEach(function(b){
    b.onclick = function(){ modalSammelberichtAnsicht(b.getAttribute('data-viewsammelbericht')); };
  });

  document.querySelectorAll('[data-loeschsammelbericht]').forEach(function(b){
    b.onclick = function(){
      var sbId = b.getAttribute('data-loeschsammelbericht');
      if(!confirm('Diesen Sammelbericht wirklich unwiderruflich löschen?')) return;
      dbDelete('sammelberichte', sbId, function(){
        state.sammelberichte = state.sammelberichte.filter(function(x){ return x.id !== sbId; });
        render();
      });
    };
  });
}

// ---------- Tab Nav ----------
document.querySelectorAll('.tabbtn').forEach(function(b){
  b.addEventListener('click', function(){
    state.tab = b.getAttribute('data-tab');
    render();
  });
});

document.getElementById('fabBtn').addEventListener('click', function(){
  if(!state.rolle) return;
  if(state.tab === 'kunden' || state.tab === 'dashboard'){
    modalNeuerKunde();
  } else if(state.tab === 'kundeDetail'){
    modalNeuesGeraet(state.activeKundeId);
  } else if(state.tab === 'pruefungen'){
    modalNeuerKunde();
  } else if(state.tab === 'lager'){
    modalNeuerLagerartikel();
  } else {
    modalNeuerKunde();
  }
});

// ---------- Start ----------
var appGestartet = false;
try {
  openDb(function(){
    try {
      loadAll(function(){
        try {
          render();
          appGestartet = true;
          starteEchtzeitSync();
        } catch(err){
          console.error('Startfehler beim Rendern', err);
          zeigeStartFehler('Fehler beim Starten: ' + (err && err.message ? err.message : err) + '. Bitte Seite neu laden.');
        }
      });
    } catch(err){
      console.error('Startfehler beim Laden', err);
      zeigeStartFehler('Fehler beim Laden der Daten: ' + (err && err.message ? err.message : err) + '. Bitte Seite neu laden.');
    }
  });
} catch(err){
  console.error('Startfehler beim Öffnen der Datenbank', err);
  zeigeStartFehler('Fehler beim Öffnen der Datenbank: ' + (err && err.message ? err.message : err) + '. Bitte Seite neu laden.');
}
setTimeout(function(){
  if(!appGestartet){
    zeigeStartFehler('Die App braucht ungewöhnlich lange zum Laden. Bitte alle anderen offenen Tabs/Instanzen dieser App schließen und danach diese Seite neu laden.');
  }
}, 6000);

</script>
</body>
</html>
