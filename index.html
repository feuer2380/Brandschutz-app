function buildStatistikDruckHtml(statFilter){
  var statLabels = {tag:'Heute', woche:'Diese Woche', monat:'Diesen Monat', jahr:'Dieses Jahr'};
  var jetztDate = new Date();
  var alleErledigt = state.pruefungen.filter(function(p){ return p.erledigt && p.erledigtAm; });
  var startBereich;
  if(statFilter === 'tag'){
    startBereich = new Date(jetztDate.getFullYear(), jetztDate.getMonth(), jetztDate.getDate());
  } else if(statFilter === 'woche'){
    var wochentag = (jetztDate.getDay() + 6) % 7;
    startBereich = new Date(jetztDate.getFullYear(), jetztDate.getMonth(), jetztDate.getDate() - wochentag);
  } else if(statFilter === 'monat'){
    startBereich = new Date(jetztDate.getFullYear(), jetztDate.getMonth(), 1);
  } else {
    startBereich = new Date(jetztDate.getFullYear(), 0, 1);
  }
  var statListe = alleErledigt.filter(function(p){ var pd = new Date(p.erledigtAm); return pd >= startBereich && pd <= jetztDate; });
  statListe.sort(function(a,b){ return new Date(b.erledigtAm) - new Date(a.erledigtAm); });
  var anzInOrdnung = statListe.filter(function(p){ return p.ergebnis === 'In Ordnung'; }).length;
  var anzReparatur = statListe.filter(function(p){ return p.ergebnis === 'Reparatur nötig'; }).length;
  var anzAusgeschieden = statListe.filter(function(p){ return p.ergebnis === 'Ausgeschieden'; }).length;
  var kundenSet = {};
  statListe.forEach(function(p){
    var k = kundeFuerPruefung(p);
    if(k) kundenSet[k.id] = true;
  });
  var anzKunden = Object.keys(kundenSet).length;

  var html = '';
  html += '<div class="bericht-brief">';
  html += '<div class="pb-kopfzeile">';
  html += '<div class="pb-titel"><h1>Statistik</h1><div class="sub">' + (statLabels[statFilter] || '') + '</div></div>';
  html += '<img src="' + LOGO_DATA + '" class="pb-logo">';
  html += '</div>';
  html += '<div class="pb-berichtnr">Stand: ' + fmtDate(new Date().toISOString()) + '</div>';
  html += '<table class="pb-tabelle"><thead><tr><th>Überprüft</th><th>Kunden geprüft</th><th>In Ordnung</th><th>Reparatur</th><th>Ausgeschieden</th></tr></thead><tbody>';
  html += '<tr><td>' + statListe.length + '</td><td>' + anzKunden + '</td><td>' + anzInOrdnung + '</td><td>' + anzReparatur + '</td><td>' + anzAusgeschieden + '</td></tr>';
  html += '</tbody></table>';
  if(statListe.length === 0){
    html += '<div class="empty">In diesem Zeitraum wurde nichts überprüft</div>';
  } else {
    html += '<table class="pb-tabelle" style="margin-top:16px;"><thead><tr><th>Kunde</th><th>Ergebnis</th><th>Gerät/Prüfung</th><th>Datum</th></tr></thead><tbody>';
    statListe.forEach(function(p){
      var k = kundeFuerPruefung(p);

function buildErgebnisChart(anzOk, anzRep, anzAus){
  var gesamt = anzOk + anzRep + anzAus;
  var html = '<div class="ergebnis-chart">';
  var zeilen = [
    {label:'In Ordnung', wert:anzOk, farbe:'var(--ok)'},
    {label:'Reparatur', wert:anzRep, farbe:'#1d5fa8'},
    {label:'Ausgeschieden', wert:anzAus, farbe:'var(--warn)'}
  ];
  zeilen.forEach(function(z){
    var proz = gesamt > 0 ? Math.round((z.wert / gesamt) * 100) : 0;
    html += '<div class="ergebnis-zeile">';
    html += '<div class="ergebnis-label">' + z.label + '</div>';
    html += '<div class="ergebnis-bar-bg"><div class="ergebnis-bar" style="width:' + proz + '%; background:' + z.farbe + ';"></div></div>';
    html += '<div class="ergebnis-zahl">' + z.wert + '</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function buildZeitChart(datumsListe, statFilter, jetztDate, monatNamen){
  var bins = [];
  var i;
  if(statFilter === 'woche'){
    var tagNamen = ['Mo','Di','Mi','Do','Fr','Sa','So'];
    var wochentagHeute = (jetztDate.getDay() + 6) % 7;
    var montag = new Date(jetztDate.getFullYear(), jetztDate.getMonth(), jetztDate.getDate() - wochentagHeute);
    for(i = 0; i < 7; i++){
      var tag = new Date(montag.getFullYear(), montag.getMonth(), montag.getDate() + i);
      bins.push({ label: tagNamen[i], von: tag, bis: new Date(tag.getFullYear(), tag.getMonth(), tag.getDate() + 1) });
    }
  } else if(statFilter === 'monat'){
    var ersterDesMonats = new Date(jetztDate.getFullYear(), jetztDate.getMonth(), 1);
    var wochentagErster = (ersterDesMonats.getDay() + 6) % 7;
    var wochenStart = new Date(ersterDesMonats.getFullYear(), ersterDesMonats.getMonth(), 1 - wochentagErster);
    var letzterDesMonats = new Date(jetztDate.getFullYear(), jetztDate.getMonth() + 1, 0);
    var cur = wochenStart;
    while(cur <= letzterDesMonats){
      var bis = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 7);
      bins.push({ label: 'KW ' + fmtKW2(cur), von: cur, bis: bis });
      cur = bis;
    }
  } else {
    var kurzNamen = ['Jän','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
    for(i = 0; i < 12; i++){
      bins.push({ label: kurzNamen[i], von: new Date(jetztDate.getFullYear(), i, 1), bis: new Date(jetztDate.getFullYear(), i + 1, 1) });
    }
  }
  bins.forEach(function(b){
    b.anzahl = datumsListe.filter(function(iso){
      var d = new Date(iso);
      return d >= b.von && d < b.bis;
    }).length;
  });
  var maxWert = 0;
  bins.forEach(function(b){ if(b.anzahl > maxWert) maxWert = b.anzahl; });
  var html = '<div class="zeit-chart">';
  html += '<div class="zeit-balken-bereich">';
  bins.forEach(function(b){
    var hoehe = maxWert > 0 ? Math.max(Math.round((b.anzahl / maxWert) * 100), (b.anzahl > 0 ? 6 : 2)) : 2;
    html += '<div class="zeit-balken-spalte">';
    if(b.anzahl > 0) html += '<div class="zeit-balken-zahl">' + b.anzahl + '</div>';
    html += '<div class="zeit-balken" style="height:' + hoehe + '%;"></div>';
    html += '<div class="zeit-balken-label">' + b.label + '</div>';
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}

function fmtKW2(datum){
  var d = new Date(Date.UTC(datum.getFullYear(), datum.getMonth(), datum.getDate()));
  var dayNr = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNr + 3);
  var firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  var kw = 1 + Math.round(((d - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
  return kw;
}

        html += '<div class="ergebnis-bar-bg"><div class="ergebnis-bar" style="width:' + proz + '%; background:var(--ok);"></div></div>';
        html += '<div class="ergebnis-zahl">' + wert + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }
  }

  if(subTab === 'portal'){
    html += '<div class="section-title" style="margin-top:4px;">Kunden mit Portalzugang</div>';
    var portalKunden = state.kunden.filter(function(k){ return k.freigabe; });

      html += '<div class="empty">Noch kein Kunde freigegeben</div>';
    } else {
      portalKunden.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); }).forEach(function(k){
        html += '<div class="card">';
        html += '<div class="row"><h3>' + escapeHtml(k.name) + '</h3></div>';
        html += '<div class="meta">Zugangscode: <b>' + escapeHtml(k.zugangscode || '(keiner erzeugt)') + '</b></div>';
        html += '</div>';
      });
    }

    html += '<div class="section-title" style="margin-top:20px;">Portal-Zugriffe</div>';
    var zugriffe = (state.portal_zugriffe || []).slice().sort(function(a,b){
      return new Date(b.zeitpunkt) - new Date(a.zeitpunkt);
    });
    if(zugriffe.length === 0){
      html += '<div class="empty">Noch kein Kunde hat das Portal aufgerufen</div>';
    } else {
      zugriffe.slice(0, 50).forEach(function(z){
        html += '<div class="card">';
        html += '<div class="row"><h3>' + escapeHtml(z.kundenname || 'Unbekannt') + '</h3>' + (z.kundennummer ? '<span class="badge ok">Nr. ' + escapeHtml(z.kundennummer) + '</span>' : '') + '</div>';
        html += '<div class="meta">' + escapeHtml(z.typ || '') + (z.standort ? ' &middot; ' + escapeHtml(z.standort) : '') + '</div>';
        html += '<div class="meta">' + fmtDate(z.zeitpunkt) + ' um ' + fmtZeit(z.zeitpunkt) + ' Uhr</div>';
        html += '</div>';
      });
      if(zugriffe.length > 50){
        html += '<div class="meta" style="text-align:center;">... und ' + (zugriffe.length - 50) + ' weitere</div>';
      }
    }
  }

  return html;
}

  var html = '';

  html += '<div class="section-title">Sammelberichte</div>';

      }

      html += '<div class="card">';

      html += '<div class="meta">' + (sb.geraeteSnapshot ? sb.geraeteSnapshot.length : 0) + ' Position(en) &middot; ' + fmtDate(sb.datum) + (sb.berichtNr ? ' &middot; ' + escapeHtml(sb.berichtNr) : '') + '</div>';
      html += '<div style="display:flex; gap:8px; margin-top:8px;">';
      html += '<button class="btn small secondary" data-viewsammelbericht="' + sb.id + '">Bericht ansehen</button>';
      html += '<button class="btn small" style="background:#b02a2a; color:#fff;" data-loeschsammelbericht="' + sb.id + '">Löschen</button>';
      html += '</div>';
      html += '</div>';
    });

  html += '<div class="section-title">Ausgeschiedene Feuerlöscher</div>';
  if(ausgeschieden.length === 0){
    html += '<div class="empty">Noch keine Geräte ausgeschieden</div>';
  } else {
    ausgeschieden.forEach(function(g){
      var k = state.kunden.filter(function(x){ return x.id === g.kundeId; })[0];
      html += '<div class="card">';
      html += '<div class="row"><h3>' + escapeHtml(g.typ) + '</h3><span class="badge warn">Ausgeschieden</span></div>';
      html += '<div class="meta">' + (k ? escapeHtml(k.name) : 'Unbekannt') + (g.standort ? ' &middot; ' + escapeHtml(g.standort) : '') + '</div>';
      html += '<div class="meta">' + (g.baujahr ? 'Baujahr ' + g.baujahr + ' &middot; ' : '') + 'Ausgeschieden am ' + fmtDate(g.ausgeschiedenAm) + '</div>';
      html += '<button class="btn small secondary ausgeschiedenLoeschenBtn" style="margin-top:8px;" data-gid="' + g.id + '">Endgültig löschen</button>';
      html += '</div>';
    });
  }

  html += '<div class="section-title">Daten sichern &amp; übertragen</div>';
  html += '<div class="card">';
  html += '<div class="meta" style="margin-bottom:10px;">Beim Wechsel auf eine neue Adresse (z.B. neue Web-Version) werden gespeicherte Daten nicht automatisch mitgenommen. Hier kannst du sie exportieren und auf der neuen Adresse wieder einspielen.</div>';
  html += '<button class="btn block secondary" id="exportBtn">Daten sichern (Backup-Datei erstellen)</button>';
  html += '<button class="btn block secondary" id="importBtn" style="margin-top:10px;">Backup-Datei wiederherstellen</button>';
  html += '<input type="file" id="importFile" accept="application/json" style="display:none;">';
  html += '</div>';

  return html;
}

function exportAlleDaten(){
  var daten = { kunden: state.kunden, geraete: state.geraete, pruefungen: state.pruefungen, exportDatum: new Date().toISOString() };
  var json = JSON.stringify(daten, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'brandschutz-backup-' + new Date().toISOString().substring(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

function importAlleDaten(file){
  var reader = new FileReader();
  reader.onload = function(e){
    var daten;
    try{
      daten = JSON.parse(e.target.result);
    } catch(err){
      toast('Datei konnte nicht gelesen werden');
      return;
    }
    var aufgaben = [];
    (daten.kunden || []).forEach(function(k){ aufgaben.push({ store:'kunden', obj:k }); });
    (daten.geraete || []).forEach(function(g){ aufgaben.push({ store:'geraete', obj:g }); });
    (daten.pruefungen || []).forEach(function(p){ aufgaben.push({ store:'pruefungen', obj:p }); });
    var i = 0;
    function next(){
      if(i >= aufgaben.length){
        loadAll(function(){ render(); toast('Backup eingespielt: ' + aufgaben.length + ' Eintraege'); });
        return;
      }
      var a = aufgaben[i];
      i++;
      dbPut(a.store, a.obj, next);
    }
    next();
  };
  reader.readAsText(file);
}

function escapeHtml(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function modalPruefungenVerschieben(kundeId){
  var k = state.kunden.filter(function(x){ return x.id === kundeId; })[0];
  if(!k) return;
  var offenePruefungen = state.pruefungen.filter(function(p){ return p.kundeId === kundeId && !p.erledigt; });
  var html = '';
  html += '<div class="modal-head"><h3>Prüfungen verschieben</h3><button class="close" id="mClose">&times;</button></div>';
  html += '<div class="meta" style="margin-bottom:10px;">Setzt den Termin aller ' + offenePruefungen.length + ' offenen Prüfungen von ' + escapeHtml(k.name) + ' auf ein neues Datum. Bereits erledigte Prüfungen bleiben unverändert.</div>';
  html += '<div class="row" style="gap:8px; flex-wrap:wrap;">';
  html += '<button type="button" class="btn small secondary" data-monate="3">+3 Monate</button>';
  html += '<button type="button" class="btn small secondary" data-monate="6">+6 Monate</button>';
  html += '<button type="button" class="btn small secondary" data-monate="12">+1 Jahr</button>';
  html += '</div>';
  html += '<label style="margin-top:14px;">Oder konkretes Datum</label>';
  html += '<input id="verschiebenDatum" type="date">';
  html += '<button class="btn block" id="verschiebenSpeichern" style="margin-top:14px;">Verschieben</button>';
  openModal(html);
  document.getElementById('mClose').onclick = closeModal;
  document.querySelectorAll('[data-monate]').forEach(function(b){
    b.onclick = function(){
      var monate = parseInt(b.getAttribute('data-monate'), 10);
      var d = new Date();
      d.setMonth(d.getMonth() + monate);
      var iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      document.getElementById('verschiebenDatum').value = iso;
    };
  });
  document.getElementById('verschiebenSpeichern').onclick = function(){
    var neuesDatum = document.getElementById('verschiebenDatum').value;
    if(!neuesDatum){ toast('Bitte ein Datum wählen'); return; }
    if(offenePruefungen.length === 0){ toast('Keine offenen Prüfungen zum Verschieben'); closeModal(); return; }
    var verbleibend = offenePruefungen.length;
    offenePruefungen.forEach(function(p){
      p.datum = neuesDatum;
      dbPut('pruefungen', p, function(){
        var g = state.geraete.filter(function(x){ return x.id === p.geraetId; })[0];
        var weiter = function(){
          verbleibend--;
          if(verbleibend === 0){
            loadAll(function(){ render(); closeModal(); toast('Prüfungen verschoben'); });
          }
        };
        if(g){
          g.naechstePruefung = neuesDatum;
          dbPut('geraete', g, weiter);
        } else {
          weiter();
        }
      });
    });
  };
}

function modalPruefungenKorrigieren(kundeId){
  var k = state.kunden.filter(function(x){ return x.id === kundeId; })[0];
  if(!k) return;
  var heuteIso = new Date().toISOString().substring(0,10);
  var vorEineWoche = new Date();
  vorEineWoche.setDate(vorEineWoche.getDate() - 7);
  var vorEineWocheIso = vorEineWoche.toISOString().substring(0,10);
  var html = '';
  html += '<div class="modal-head"><h3>"Heute geprüft" korrigieren</h3><button class="close" id="mClose">&times;</button></div>';
  html += '<div class="meta" style="margin-bottom:10px;">Für Geräte, die über den Gerät-Check-Bildschirm (mit "In Ordnung") eigentlich nur nachträglich erfasst wurden, statt wirklich geprüft worden zu sein. Setzt Prüfdatum + nächsten Termin auf das richtige, historische Datum zurück.</div>';
  html += '<label>Fälschlich eingetragen von</label>';
  html += '<input id="korrFalschVon" type="date" value="' + vorEineWocheIso + '">';
  html += '<label style="margin-top:8px;">bis</label>';
  html += '<input id="korrFalschBis" type="date" value="' + heuteIso + '">';
  html += '<button type="button" class="btn small secondary" id="korrSuchenBtn" style="margin-top:8px;">Betroffene anzeigen</button>';
  html += '<div id="korrErgebnisBereich" style="margin-top:14px;"></div>';
  openModal(html);
  document.getElementById('mClose').onclick = closeModal;

  var sucheBetroffene = function(){
    var falschVon = document.getElementById('korrFalschVon').value;
    var falschBis = document.getElementById('korrFalschBis').value;
    if(!falschVon || !falschBis) return;
    var treffer = state.pruefungen.filter(function(p){
      if(p.kundeId !== kundeId || !p.erledigt || !p.erledigtAm) return false;
      var tag = p.erledigtAm.substring(0,10);
      return tag >= falschVon && tag <= falschBis;
    });
    var bereich = document.getElementById('korrErgebnisBereich');
    if(treffer.length === 0){
      bereich.innerHTML = '<div class="empty">Keine in diesem Zeitraum erledigten Prüfungen gefunden</div>';
      return;
    }
    var html2 = '<div class="meta" style="margin-bottom:8px;">' + treffer.length + ' gefunden. Alle sind vorausgewählt, bei Bedarf einzelne abwählen.</div>';
    html2 += '<button type="button" class="btn small secondary" id="korrAlleAbBtn" style="margin-bottom:8px;">Alle abwählen</button>';
    treffer.forEach(function(p, i){
      var g = state.geraete.filter(function(x){ return x.id === p.geraetId; })[0];
      html2 += '<label style="display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid #eee2d3;"><input type="checkbox" class="korrCheck" data-idx="' + i + '" checked style="width:auto;"> ' + (g ? escapeHtml(g.typ) + (g.standort ? ' &middot; ' + escapeHtml(g.standort) : '') : 'Unbekanntes Gerät') + ' <span class="meta">(' + fmtDate(p.erledigtAm) + ')</span></label>';
    });
    html2 += '<label style="margin-top:14px;">Richtiges Prüfdatum (für alle ausgewählten gleich)</label>';
    html2 += '<input id="korrRichtigDatum" type="date">';
    html2 += '<button class="btn block" id="korrAnwendenBtn" style="margin-top:14px;">Korrigieren</button>';
    bereich.innerHTML = html2;
    document.getElementById('korrAlleAbBtn').onclick = function(){
      document.querySelectorAll('.korrCheck').forEach(function(cb){ cb.checked = false; });
    };
    document.getElementById('korrAnwendenBtn').onclick = function(){
      var richtigesDatum = document.getElementById('korrRichtigDatum').value;
      if(!richtigesDatum){ toast('Bitte das richtige Datum wählen'); return; }
      var ausgewaehlt = [];
      document.querySelectorAll('.korrCheck').forEach(function(cb){
        if(cb.checked) ausgewaehlt.push(treffer[parseInt(cb.getAttribute('data-idx'), 10)]);
      });
      if(ausgewaehlt.length === 0){ toast('Nichts ausgewählt'); return; }
      var korrBtn = document.getElementById('korrAnwendenBtn');
      korrBtn.disabled = true;
      korrBtn.textContent = 'Wird korrigiert...';
      var verbleibend = ausgewaehlt.length;
      var fehlerListe = [];
      var fertig = function(){
        verbleibend--;
        if(verbleibend === 0){
          if(fehlerListe.length){
            korrBtn.disabled = false;
            korrBtn.textContent = 'Korrigieren';
            toast(fehlerListe.length + ' von ' + ausgewaehlt.length + ' konnten NICHT gespeichert werden. Bitte Internetverbindung prüfen und nochmal versuchen.');
          } else {
            loadAll(function(){ render(); closeModal(); toast('Prüfdaten korrigiert (' + ausgewaehlt.length + ')'); });
          }
        }
      };
      ausgewaehlt.forEach(function(p){
        p.datum = richtigesDatum;
        p.erledigtAm = richtigesDatum + 'T12:00:00';
        db.collection('pruefungen').doc(p.id).set(p).then(function(){
          var g = state.geraete.filter(function(x){ return x.id === p.geraetId; })[0];
          if(g){
            g.letztePruefung = richtigesDatum;
            var neuerTermin = naechsterTerminNach(richtigesDatum + 'T12:00:00', g.intervallMonate);
            g.naechstePruefung = neuerTermin;
            db.collection('geraete').doc(g.id).set(g).then(function(){
              var offenePruefung = state.pruefungen.filter(function(x){ return x.geraetId === g.id && !x.erledigt && x.id !== p.id; })[0];
              if(offenePruefung){
                offenePruefung.datum = neuerTermin;
                db.collection('pruefungen').doc(offenePruefung.id).set(offenePruefung).then(fertig).catch(function(err){
                  console.error('Korrigieren-Fehler (offene Prüfung)', p.id, err);
                  fehlerListe.push(p.id); fertig();
                });
              } else {
                var pNeu = { id: uid(), kundeId: kundeId, geraetId: g.id, typ: g.typ, datum: neuerTermin, erledigt: false };
                db.collection('pruefungen').doc(pNeu.id).set(pNeu).then(fertig).catch(function(err){
                  console.error('Korrigieren-Fehler (neue Prüfung)', p.id, err);
                  fehlerListe.push(p.id); fertig();
                });
              }
            }).catch(function(err){
              console.error('Korrigieren-Fehler (Gerät)', p.id, err);
              fehlerListe.push(p.id); fertig();
            });
          } else {
            fertig();
          }
        }).catch(function(err){
          console.error('Korrigieren-Fehler (Prüfung)', p.id, err);
          fehlerListe.push(p.id); fertig();
        });
      });
    };
  };
  document.getElementById('korrSuchenBtn').onclick = sucheBetroffene;
}

function doppelteTermineBereinigen(kundeId){
  var k = state.kunden.filter(function(x){ return x.id === kundeId; })[0];
  if(!k) return;
  var offeneDesKunden = state.pruefungen.filter(function(p){ return p.kundeId === kundeId && !p.erledigt; });
  var nachGeraet = {};
  offeneDesKunden.forEach(function(p){
    var gid = p.geraetId || 'ohne';
    if(!nachGeraet[gid]) nachGeraet[gid] = [];
    nachGeraet[gid].push(p);
  });
  var zuLoeschen = [];
  Object.keys(nachGeraet).forEach(function(gid){
    var liste = nachGeraet[gid];
    if(liste.length > 1){
      liste.sort(function(a,b){ return new Date(b.datum) - new Date(a.datum); });
      for(var i = 1; i < liste.length; i++) zuLoeschen.push(liste[i]);
    }
  });

  var erledigteDesKunden = state.pruefungen.filter(function(p){ return p.kundeId === kundeId && p.erledigt && p.erledigtAm; });
  var nachGeraetZeit = {};
  erledigteDesKunden.forEach(function(p){
    var schluessel = (p.geraetId || 'ohne') + '|' + p.erledigtAm;
    if(!nachGeraetZeit[schluessel]) nachGeraetZeit[schluessel] = [];
    nachGeraetZeit[schluessel].push(p);
  });
  Object.keys(nachGeraetZeit).forEach(function(schluessel){
    var liste = nachGeraetZeit[schluessel];
    if(liste.length > 1){
      for(var i = 1; i < liste.length; i++) zuLoeschen.push(liste[i]);
    }
  });

  if(zuLoeschen.length === 0){
    openModal('<div class="modal-head"><h3>Doppelte Termine</h3><button class="close" id="mClose">&times;</button></div><div class="empty">Keine doppelten Termine gefunden.</div>');
    document.getElementById('mClose').onclick = closeModal;
    return;
  }
  var html = '<div class="modal-head"><h3>Doppelte Termine bereinigen</h3><button class="close" id="mClose">&times;</button></div>';
  html += '<div class="meta" style="margin-bottom:10px;">' + zuLoeschen.length + ' doppelte Einträge gefunden (offene Termine: jeweils der neueste pro Gerät bleibt; erledigte Prüfungen: exakt gleiches Gerät + exakt gleiche Uhrzeit gelten als Duplikat, davon bleibt einer). Es wird jeweils nur der Überschuss gelöscht.</div>';
  html += '<button class="btn block" id="bereinigenBestaetigenBtn">' + zuLoeschen.length + ' doppelte Termine löschen</button>';
  openModal(html);
  document.getElementById('mClose').onclick = closeModal;
  var btn = document.getElementById('bereinigenBestaetigenBtn');
  btn.onclick = function(){
    btn.disabled = true;
    btn.textContent = 'Wird bereinigt...';
    var verbleibend = zuLoeschen.length;
    zuLoeschen.forEach(function(p){
      dbDelete('pruefungen', p.id, function(){
        verbleibend--;
        if(verbleibend === 0){
          loadAll(function(){ render(); closeModal(); toast('Doppelte Termine bereinigt'); });
        }
      });
    });
  };
}

function nummernNeuOrdnen(kundeId){
  var k = state.kunden.filter(function(x){ return x.id === kundeId; })[0];
  if(!k) return;
  openModal('<div class="modal-head"><h3>Gerätenummern neu ordnen</h3><button class="close" id="mClose">&times;</button></div><div class="meta">Lade aktuellen Gerätestand...</div>');
  document.getElementById('mClose').onclick = closeModal;

  dbGetAll('geraete', function(alleGeraete){
    var alle = alleGeraete.filter(function(g){ return g.kundeId === kundeId && !g.ausgeschieden; });
    var ausgeschiedeneAnzahl = alleGeraete.filter(function(g){ return g.kundeId === kundeId && g.ausgeschieden; }).length;
    if(alle.length === 0){
      openModal('<div class="modal-head"><h3>Gerätenummern</h3><button class="close" id="mClose">&times;</button></div><div class="empty">Keine aktiven Geräte vorhanden.</div>');
      document.getElementById('mClose').onclick = closeModal;
      return;
    }
    // Mögliche Doppel-Erfassungen erkennen (gleicher Typ + Standort + Kategorie)
    var schluesselZaehlung = {};
    alle.forEach(function(g){
      var schluessel = (g.kategorie||'') + '|' + (g.typ||'') + '|' + (g.standort||'');
      schluesselZaehlung[schluessel] = (schluesselZaehlung[schluessel] || 0) + 1;
    });
    var moeglicheDuplikate = Object.keys(schluesselZaehlung).filter(function(s){ return schluesselZaehlung[s] > 1; });

    var html = '<div class="modal-head"><h3>Gerätenummern neu ordnen</h3><button class="close" id="mClose">&times;</button></div>';
    html += '<div class="meta" style="margin-bottom:10px;">Nummeriert alle ' + alle.length + ' aktiven Geräte dieses Kunden pro Kategorie neu durch, streng nach Anlegedatum (1, 2, 3, ...), ohne Lücken oder Sprünge. Ausgeschiedene Geräte (' + ausgeschiedeneAnzahl + ') werden dabei übersprungen, damit in der sichtbaren Liste keine Lücken entstehen. Bereits gedruckte Etiketten mit alten Nummern stimmen danach eventuell nicht mehr überein.</div>';
    if(moeglicheDuplikate.length){
      html += '<div class="meta" style="color:#a3300d; margin-bottom:10px;">Achtung: ' + moeglicheDuplikate.length + ' möglicherweise doppelt erfasste Geräte gefunden (gleicher Typ + Standort). Bitte nach dem Nummerieren die Geräteliste kontrollieren, ob wirklich zwei separate Türen gemeint sind oder eine davon gelöscht werden sollte.</div>';
    }
    html += '<button class="btn block" id="nummernBestaetigenBtn">Jetzt neu nummerieren</button>';
    openModal(html);
    document.getElementById('mClose').onclick = closeModal;
    var btn = document.getElementById('nummernBestaetigenBtn');
    btn.onclick = function(){
      btn.disabled = true;
      btn.textContent = 'Wird nummeriert...';
      var proKategorie = {};
      var sortiert = alle.slice().sort(function(a,b){
        return geraeteSortierVergleich(a, b);
      });
      var verbleibend = sortiert.length;
      var fehlerListe = [];
      var neueWerte = {};
      var fertig = function(){
        verbleibend--;
        if(verbleibend === 0){
          if(fehlerListe.length){
            btn.disabled = false;
            btn.textContent = 'Jetzt neu nummerieren';
            toast(fehlerListe.length + ' von ' + sortiert.length + ' Geräten konnten NICHT gespeichert werden. Bitte Internetverbindung prüfen und nochmal versuchen.');
          } else {
            // Zur Kontrolle NICHT aus dem Zwischenspeicher, sondern direkt vom Server nachfragen
            db.collection('geraete').where('kundeId', '==', kundeId).get({ source: 'server' }).then(function(snap){
              var kontrollHtml = '<div class="modal-head"><h3>Ergebnis (vom Server geprüft)</h3><button class="close" id="mClose2">&times;</button></div>';
              var passtNicht = 0;
              var zeilen = [];
              snap.forEach(function(doc){
                var g = doc.data();
                if(!(g.id in neueWerte)) return; // ausgeschiedene/nicht mit-nummerierte Geräte hier nicht anzeigen
                var erwartet = neueWerte[g.id];
                var stimmt = (g.nr === erwartet);
                if(!stimmt) passtNicht++;
                zeilen.push({ g: g, erwartet: erwartet, stimmt: stimmt });
              });
              zeilen.sort(function(a,b){ return (a.erwartet||0) - (b.erwartet||0); });
              if(passtNicht === 0){
                kontrollHtml += '<div class="meta" style="color:#226b32; margin-bottom:10px;">Server bestätigt: Alle ' + zeilen.length + ' Geräte korrekt gespeichert.</div>';
              } else {
                kontrollHtml += '<div class="meta" style="color:#a3300d; margin-bottom:10px;">Achtung: Bei ' + passtNicht + ' Geräten stimmt der Server-Stand NICHT mit dem erwarteten Wert überein (unten rot markiert).</div>';
              }
              zeilen.forEach(function(z){
                kontrollHtml += '<div class="meta" style="' + (z.stimmt ? '' : 'color:#a3300d; font-weight:700;') + '">Nr. ' + z.g.nr + ' (erwartet ' + z.erwartet + ') &middot; ' + escapeHtml(z.g.typ || '') + ' &middot; ' + escapeHtml(z.g.standort || '') + '</div>';
              });
              openModal(kontrollHtml);
              // Angezeigten Stand direkt mit dem bestätigten Server-Stand überschreiben,
              // damit die App nicht durch einen noch nicht aufgeholten Zwischenspeicher wieder alte Werte zeigt.
              snap.forEach(function(doc){
                var frisch = doc.data();
                var idxLokal = state.geraete.findIndex(function(x){ return x.id === frisch.id; });
                if(idxLokal !== -1) state.geraete[idxLokal] = frisch;
              });
              document.getElementById('mClose2').onclick = function(){
                closeModal();
                render();
              };
            }).catch(function(err){
              toast('Server-Kontrolle fehlgeschlagen: ' + (err && err.message ? err.message : err));
              console.error('Server-Kontrolle Fehler', err);
            });
          }
        }
      };
      sortiert.forEach(function(g){
        var kat = (g.kategorie || 'Feuerlöscher').trim();
        proKategorie[kat] = (proKategorie[kat] || 0) + 1;
        g.nr = proKategorie[kat];
        neueWerte[g.id] = g.nr;
        try{
          db.collection('geraete').doc(g.id).set(g).then(function(){
            fertig();
          }).catch(function(err){
            console.error('Nummerieren-Fehler bei Gerät', g.id, g.typ, err);
            fehlerListe.push(g.id);
            fertig();
          });
        } catch(e){
          console.error('Nummerieren-Ausnahme bei Gerät', g.id, e);
          fehlerListe.push(g.id);
          fertig();
        }
      });
    };
  });
}

function fehlendeTermineNachtragen(kundeId){
  var k = state.kunden.filter(function(x){ return x.id === kundeId; })[0];
  if(!k) return;
  var geraeteDesKunden = state.geraete.filter(function(g){ return g.kundeId === kundeId && !g.ausgeschieden; });
  var betroffene = geraeteDesKunden.filter(function(g){
    var hatOffene = state.pruefungen.some(function(p){ return p.geraetId === g.id && !p.erledigt; });
    return !hatOffene && g.naechstePruefung;
  });
  if(betroffene.length === 0){
    openModal('<div class="modal-head"><h3>Fehlende Termine</h3><button class="close" id="mClose">&times;</button></div><div class="empty">Alle Geräte haben bereits einen offenen Prüftermin.</div>');
    document.getElementById('mClose').onclick = closeModal;
    return;
  }
  var html = '<div class="modal-head"><h3>Fehlende Termine nachtragen</h3><button class="close" id="mClose">&times;</button></div>';
  html += '<div class="meta" style="margin-bottom:10px;">' + betroffene.length + ' Geräte haben ein "nächste Prüfung"-Datum, aber keinen zugehörigen offenen Termin-Datensatz (deshalb fehlen sie in "Diesen Monat"/"Bald fällig"). Das trägt den fehlenden Termin nach, ohne sonst etwas zu ändern.</div>';
  betroffene.slice(0, 15).forEach(function(g){
    html += '<div class="meta">' + escapeHtml(g.typ) + (g.standort ? ' &middot; ' + escapeHtml(g.standort) : '') + ' &middot; fällig ' + fmtDate(g.naechstePruefung) + '</div>';
  });
  if(betroffene.length > 15) html += '<div class="meta">... und ' + (betroffene.length - 15) + ' weitere</div>';
  html += '<button class="btn block" id="fehlendeTermineBestaetigenBtn" style="margin-top:14px;">' + betroffene.length + ' Termine nachtragen</button>';
  openModal(html);
  document.getElementById('mClose').onclick = closeModal;
  var bestaetigenBtn = document.getElementById('fehlendeTermineBestaetigenBtn');
  bestaetigenBtn.onclick = function(){
    bestaetigenBtn.disabled = true;
    bestaetigenBtn.textContent = 'Wird nachgetragen...';
    var verbleibend = betroffene.length;
    betroffene.forEach(function(g){
      var pNeu = { id: uid(), kundeId: kundeId, geraetId: g.id, typ: g.typ, datum: g.naechstePruefung, erledigt: false };
      dbPut('pruefungen', pNeu, function(){
        verbleibend--;
        if(verbleibend === 0){
          loadAll(function(){ render(); closeModal(); toast('Fehlende Termine nachgetragen'); });
        }
      });
    });
  };
}

function qrMitRand(targetId){
  setTimeout(function(){
    var qrDiv = document.getElementById(targetId);
    if(!qrDiv) return;
    var innerCanvas = qrDiv.querySelector('canvas');
    if(!innerCanvas) return;
    var rand = Math.round(innerCanvas.width * 0.14);
    var bordered = document.createElement('canvas');
    bordered.width = innerCanvas.width + rand*2;
    bordered.height = innerCanvas.height + rand*2;
    var ctx = bordered.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, bordered.width, bordered.height);
    ctx.drawImage(innerCanvas, rand, rand);
    var img = document.createElement('img');
    img.src = bordered.toDataURL('image/png');
    img.style.maxWidth = '100%';
    img.style.height = 'auto';
    img.style.display = 'block';
    qrDiv.innerHTML = '';
    qrDiv.appendChild(img);
  }, 60);
}

function findeDuplikatExterneId(externeId, eigeneGeraetId){
  if(!externeId) return null;
  var treffer = state.geraete.filter(function(x){ return x.externeId === externeId && x.id !== eigeneGeraetId; })[0];
  if(!treffer) return null;
  var k = state.kunden.filter(function(x){ return x.id === treffer.kundeId; })[0];
  return { geraet: treffer, kunde: k };
}


function berechneAktuelleGeraeteNr(g){
  if(g.nr) return g.nr;
  var kat = (g.kategorie || 'Feuerlöscher').trim();
  var geschwister = state.geraete.filter(function(x){ return x.kundeId === g.kundeId && !x.ausgeschieden && ((x.kategorie || 'Feuerlöscher').trim()) === kat; });
  geschwister.sort(function(a,b){ return geraeteSortierVergleich(a, b); });
  for(var i=0; i<geschwister.length; i++){
    if(geschwister[i].id === g.id) return i+1;
  }
  return null;
}

function baujahrStatus(baujahr, letzteInnenrevision){
  if(!baujahr) return null;
  var jetzt = new Date().getFullYear();
  var alter = jetzt - baujahr;
  var ausscheideJahr = baujahr + 20;
  if(alter >= 20){
    return { cls:'warn', label:'Zu alt (' + alter + ' J.) - ausscheiden', ausscheideJahr: ausscheideJahr };
  }
  var basisJahr = letzteInnenrevision ? new Date(letzteInnenrevision).getFullYear() : baujahr;
  var naechstes = basisJahr + 6;
  if(naechstes >= ausscheideJahr){
    return { cls:'warn', label:'Zu alt - ausscheiden', ausscheideJahr: ausscheideJahr };
  }
  var restJahre = naechstes - jetzt;
  if(restJahre <= 0){
    return { cls:'soon', label:'Innenrevision fällig (' + naechstes + ')', ausscheideJahr: ausscheideJahr, faelligJahr: naechstes };
  }
  return { cls:'ok', label:'Innenrevision: ' + naechstes, ausscheideJahr: ausscheideJahr, faelligJahr: naechstes };
}

function parseAltesSystemText(text){
  var zeilen = text.split('\n').map(function(z){ return z.trim(); }).filter(function(z){ return z.length > 0; });
  var labels = {
    'feuerlöscher nr': 'externeId',
    'feuerlöscher': 'typ',
    'beschreibung': 'beschreibung',
    'seriennummer': 'seriennummer',
    'baujahr': 'baujahr',
    'ort': 'standort',
    'neues datum': 'naechstePruefung',
    'altes datum': 'letztePruefung'
  };
  var labelSchluessel = Object.keys(labels).sort(function(a, b){ return b.length - a.length; });
  var ergebnis = {};
  for(var i = 0; i < zeilen.length; i++){
    var zeile = zeilen[i];
    var zeileLower = zeile.toLowerCase();
    for(var j = 0; j < labelSchluessel.length; j++){
      var lbl = labelSchluessel[j];
      if(zeileLower.indexOf(lbl) !== 0) continue;
      var rest = zeile.substring(lbl.length).replace(/^[\s:.\-]+/, '').trim();
      var feld = labels[lbl];
      if(!rest && zeilen[i+1]){
        rest = zeilen[i+1];
        i++;
      }
      if(rest) ergebnis[feld] = rest;
      break;
    }
  }
  return ergebnis;
}

function bindEinfuegenAltesSystem(){
  var btn = document.getElementById('btnEinfuegenUebernehmen');
  if(!btn) return;
  btn.onclick = function(){
    var text = document.getElementById('fEinfuegeText').value;
    if(!text || !text.trim()){ toast('Bitte zuerst Text einfügen'); return; }
    var werte = parseAltesSystemText(text);
    var typFeld = document.getElementById('fTyp');
    if(typFeld && werte.typ){
      typFeld.value = werte.beschreibung ? (werte.typ + ' (' + werte.beschreibung + ')') : werte.typ;
    } else if(typFeld && werte.beschreibung && !werte.typ){
      typFeld.value = werte.beschreibung;
    }
    var seriennrFeld = document.getElementById('fSeriennr');
    if(seriennrFeld && werte.seriennummer) seriennrFeld.value = werte.seriennummer;
    var baujahrFeld = document.getElementById('fBaujahr');
    if(baujahrFeld && werte.baujahr) baujahrFeld.value = werte.baujahr;
    var standortFeld = document.getElementById('fStandort');
    if(standortFeld && werte.standort) standortFeld.value = werte.standort;
    var nrFeld = document.getElementById('fNr');
    if(nrFeld && werte.externeId && /^[0-9]+$/.test(werte.externeId.trim())){
      nrFeld.value = werte.externeId.trim();
      nrFeld.setAttribute('data-manuell', '1');
    }
    var naechsteFeld = document.getElementById('fDatum');
    if(naechsteFeld && werte.naechstePruefung){
      var teile = werte.naechstePruefung.split('.');
      if(teile.length === 3) naechsteFeld.value = teile[2] + '-' + teile[1] + '-' + teile[0];
    }
    var letzteFeld = document.getElementById('fLetztePruefung');
    if(letzteFeld && werte.letztePruefung){
      var teileL = werte.letztePruefung.split('.');
      if(teileL.length === 3) letzteFeld.value = teileL[2] + '-' + teileL[1] + '-' + teileL[0];
    }
    if(naechsteFeld && !werte.naechstePruefung && letzteFeld && letzteFeld.value){
      var intervallFeld = document.getElementById('fIntervall');
      var intervallWert = intervallFeld ? (parseInt(intervallFeld.value, 10) || 24) : 24;
      naechsteFeld.value = naechsterTerminNach(letzteFeld.value, intervallWert);
    }
    var anzahl = Object.keys(werte).length;
    toast(anzahl ? (anzahl + ' Feld(er) übernommen - bitte prüfen') : 'Keine bekannten Felder im Text gefunden');
  };
}

function initSigPad(canvasId){
  var canvas = document.getElementById(canvasId);
  if(!canvas) return null;
  var ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2,2);
  ctx.strokeStyle = '#1a1410';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  var drawing = false;
  function pos(e){
    var rect = canvas.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }
  function start(e){ drawing = true; var p2 = pos(e); ctx.beginPath(); ctx.moveTo(p2.x, p2.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; var p2 = pos(e); ctx.lineTo(p2.x, p2.y); ctx.stroke(); e.preventDefault(); }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  return canvas;
}

function modalFuellhistorieListe(kundeId){
  function alleGeraeteMitKunde(){
    return state.geraete
      .filter(function(g){ return !g.ausgeschieden && istFuellKategorie(g.kategorie); })
      .map(function(g){
        var k = state.kunden.filter(function(x){ return x.id === g.kundeId; })[0];
        return { g: g, k: k };
      });
  }

  function summeProEinheit(liste){
    var summen = {};
    liste.forEach(function(e){
      (e.g.fuellungen || []).forEach(function(f){
        var info = fuellungLesen(f, e.g.kategorie, e.g.standort);
        if(!summen[info.einheit]) summen[info.einheit] = 0;
        if(typeof info.menge === 'number' && !isNaN(info.menge)) summen[info.einheit] += info.menge;
      });
    });
    return summen;
  }
  function formatiereSummen(summen){
    var teile = [];
    Object.keys(summen).forEach(function(einheit){
      teile.push(summen[einheit].toLocaleString('de-AT') + ' ' + einheit);
    });
    return teile.length ? teile.join(', ') : '0';
  }

  function summeProZeitraum(liste){
    var heute = new Date(); heute.setHours(0,0,0,0);
    var jj = heute.getFullYear(), mm = heute.getMonth();
    var summenTag = {}, summenMonat = {}, summenJahr = {};
    function addiere(ziel, einheit, menge){
      if(!ziel[einheit]) ziel[einheit] = 0;
      if(typeof menge === 'number' && !isNaN(menge)) ziel[einheit] += menge;
    }
    liste.forEach(function(e){
      (e.g.fuellungen || []).forEach(function(f){
        var info = fuellungLesen(f, e.g.kategorie, e.g.standort);
        var d = new Date(f.datum);
        if(isNaN(d.getTime())) return;
        if(d.getFullYear() === jj){
          addiere(summenJahr, info.einheit, info.menge);
          if(d.getMonth() === mm) addiere(summenMonat, info.einheit, info.menge);
          var dTag = new Date(d); dTag.setHours(0,0,0,0);
          if(dTag.getTime() === heute.getTime()) addiere(summenTag, info.einheit, info.menge);
        }
      });
    });
    return { tag: summenTag, monat: summenMonat, jahr: summenJahr };
  }

  function neuZeichnen(suchtext, katFilter){
    var q = (suchtext || '').trim().toLowerCase();
    var alle = alleGeraeteMitKunde();
    if(katFilter) alle = alle.filter(function(e){ return (e.g.kategorie || 'Perchtl Zisch') === katFilter; });
    var gefiltert = q ? alle.filter(function(e){
      var standort = (e.g.standort || '').toLowerCase();
      var kundeName = (e.k ? e.k.name : '').toLowerCase();
      var typ = (e.g.typ || '').toLowerCase();
      return standort.indexOf(q) !== -1 || kundeName.indexOf(q) !== -1 || typ.indexOf(q) !== -1;
    }) : alle;

    var html = '';
    html += '<div class="modal-head"><h3>Füllhistorie</h3><button class="close" id="mClose">&times;</button></div>';
    html += '<div style="display:flex; gap:6px; margin-bottom:10px;">';
    html += '<button type="button" class="btn small' + (!katFilter ? '' : ' secondary') + '" data-katfilter="">Alle</button>';
    html += '<button type="button" class="btn small' + (katFilter === 'Perchtl Zisch' ? '' : ' secondary') + '" data-katfilter="Perchtl Zisch">Perchtl Zisch</button>';
    html += '<button type="button" class="btn small' + (katFilter === 'CO2-Flaschen' ? '' : ' secondary') + '" data-katfilter="CO2-Flaschen">CO2-Flaschen</button>';
    html += '</div>';
    html += '<input type="text" id="fuellSuche" placeholder="Suche nach Standort, Kunde oder Typ..." value="' + escapeHtml(suchtext || '') + '">';

    var gesamtFuellungen = 0;
    gefiltert.forEach(function(e){ gesamtFuellungen += (e.g.fuellungen || []).length; });
    var summen = summeProEinheit(gefiltert);
    var zeitraeume = summeProZeitraum(gefiltert);
    html += '<div class="card" style="margin-top:12px; background:#f3e9da;">';
    html += '<div class="row"><h3>Gesamt' + ((q || katFilter) ? ' (gefiltert)' : '') + '</h3><span class="badge blau">' + gefiltert.length + ' Flasche' + (gefiltert.length === 1 ? '' : 'n') + '</span></div>';
    html += '<div class="meta">' + gesamtFuellungen + ' Füllung' + (gesamtFuellungen === 1 ? '' : 'en') + ' insgesamt</div>';
    html += '<div class="meta">Gesamtmenge: ' + formatiereSummen(summen) + '</div>';
    html += '<div class="meta" style="margin-top:6px;">Heute abgefüllt: ' + formatiereSummen(zeitraeume.tag) + '</div>';
    html += '<div class="meta">Diesen Monat abgefüllt: ' + formatiereSummen(zeitraeume.monat) + '</div>';
    html += '<div class="meta">Dieses Jahr abgefüllt: ' + formatiereSummen(zeitraeume.jahr) + '</div>';
    html += '</div>';

    html += '<button type="button" class="btn block" id="fuellDruckenBtn" style="margin-top:14px;">Statistik drucken / als PDF teilen</button>';

    if(gefiltert.length === 0){
      html += '<div class="empty">Keine Flaschen gefunden</div>';
    } else {
      gefiltert.forEach(function(e){
        var g = e.g;
        var fuellungen = (g.fuellungen || []);
        var summenGeraet = summeProEinheit([e]);
        var sortiert = fuellungen.slice().sort(function(a,b){ return new Date(b.datum) - new Date(a.datum); });
        var zeitraum = fuellungen.length > 0 ? (fmtDatumZeitLokal(sortiert[sortiert.length-1].datum) + ' bis ' + fmtDatumZeitLokal(sortiert[0].datum)) : null;

        html += '<div class="card">';
        html += '<div class="row"><h3>' + escapeHtml(g.typ || 'Flasche') + '</h3><span class="badge blau">' + fuellungen.length + ' Füllung' + (fuellungen.length === 1 ? '' : 'en') + '</span></div>';
        html += '<div class="meta">' + (e.k ? escapeHtml(e.k.name) + ' &middot; ' : '') + escapeHtml(g.standort || '') + (g.seriennummer ? (' &middot; SN ' + escapeHtml(g.seriennummer)) : '') + '</div>';
        if(fuellungen.length > 0){
          html += '<div class="meta">Zeitraum: ' + zeitraum + '</div>';
          html += '<div class="meta">Gesamtmenge: ' + formatiereSummen(summenGeraet) + '</div>';
        }
        html += '<button type="button" class="btn small secondary" data-fuellhistoriedetail="' + g.id + '" style="margin-top:8px;">Details</button>';
        html += '</div>';
      });
    }
    openModal(html);
    document.getElementById('mClose').onclick = closeModal;
    var suchEl = document.getElementById('fuellSuche');
    suchEl.focus();
    suchEl.setSelectionRange(suchEl.value.length, suchEl.value.length);
    suchEl.oninput = function(){ neuZeichnen(suchEl.value, katFilter); };
    document.querySelectorAll('[data-katfilter]').forEach(function(b){
      b.onclick = function(){ neuZeichnen(suchtext, b.getAttribute('data-katfilter') || null); };
    });
    document.getElementById('fuellDruckenBtn').onclick = function(){
      var pa = document.getElementById('printArea');
      pa.innerHTML = buildFuellstatistikHtml(gefiltert, suchtext, katFilter);
      setTimeout(function(){ window.print(); }, 120);
    };
    document.querySelectorAll('[data-fuellhistoriedetail]').forEach(function(b){
      b.onclick = function(){ modalFuellhistorie(b.getAttribute('data-fuellhistoriedetail'), kundeId, suchtext); };
    });
  }
  neuZeichnen('', null);
}

function buildFuellstatistikHtml(eintraege, suchtext, katFilter){
  // Flache Liste einzelner Füllungen bauen, gruppiert nach dem Standort zum Zeitpunkt der Füllung
  var fuellzeilen = [];
  eintraege.forEach(function(e){
    (e.g.fuellungen || []).forEach(function(f){
      var info = fuellungLesen(f, e.g.kategorie, e.g.standort);
      fuellzeilen.push({ g: e.g, k: e.k, datum: f.datum, menge: info.menge, einheit: info.einheit, standort: info.standort });
    });
  });

  var gruppen = {};
  var reihenfolge = [];
  fuellzeilen.forEach(function(z){
    var standort = z.standort || 'Ohne Standort';
    if(!gruppen[standort]){ gruppen[standort] = []; reihenfolge.push(standort); }
    gruppen[standort].push(z);
  });

  function summeProEinheitDruck(zeilen){
    var summen = {};
    zeilen.forEach(function(z){
      if(!summen[z.einheit]) summen[z.einheit] = 0;
      if(typeof z.menge === 'number' && !isNaN(z.menge)) summen[z.einheit] += z.menge;
    });
    return summen;
  }
  function formatiereSummenDruck(summen){
    var teile = [];
    Object.keys(summen).forEach(function(einheit){
      teile.push(summen[einheit].toLocaleString('de-AT') + ' ' + einheit);
    });
    return teile.length ? teile.join(', ') : '0';
  }
  function anzahlFlaschen(zeilen){
    var ids = [];
    zeilen.forEach(function(z){ if(ids.indexOf(z.g.id) === -1) ids.push(z.g.id); });
    return ids.length;
  }

  var gesamtSummen = summeProEinheitDruck(fuellzeilen);
  var zeitraeumeDruck = (function(){
    var heute = new Date(); heute.setHours(0,0,0,0);
    var jj = heute.getFullYear(), mm = heute.getMonth();
    var sT = {}, sM = {}, sJ = {};
    function addiere(ziel, einheit, menge){
      if(!ziel[einheit]) ziel[einheit] = 0;
      if(typeof menge === 'number' && !isNaN(menge)) ziel[einheit] += menge;
    }
    fuellzeilen.forEach(function(z){
      var d = new Date(z.datum);
      if(isNaN(d.getTime())) return;
      if(d.getFullYear() === jj){
        addiere(sJ, z.einheit, z.menge);
        if(d.getMonth() === mm) addiere(sM, z.einheit, z.menge);
        var dTag = new Date(d); dTag.setHours(0,0,0,0);
        if(dTag.getTime() === heute.getTime()) addiere(sT, z.einheit, z.menge);
      }
    });
    return { tag: sT, monat: sM, jahr: sJ };
  })();

  var html = '';
  html += '<div class="bericht-brief">';
  html += '<div class="pb-kopfzeile">';
  var untertitel = katFilter || 'Perchtl Zisch / CO2-Flaschen';
  html += '<div class="pb-titel"><h1>Füllstatistik</h1><div class="sub">' + escapeHtml(untertitel) + '</div>' + (suchtext ? ('<div class="sub">Filter: ' + escapeHtml(suchtext) + '</div>') : '') + '</div>';
  html += '<img src="' + ((katFilter === 'CO2-Flaschen') ? LOGO_DATA : LOGO_DATA_PZ) + '" class="pb-logo">';
  html += '</div>';
  html += '<div class="pb-berichtnr">Stand: ' + fmtDate(new Date().toISOString()) + '</div>';

  html += '<div class="pb-kundenbox">';
  html += '<div class="knr">Gesamt</div>';
  html += '<div>' + anzahlFlaschen(fuellzeilen) + ' Flasche' + (anzahlFlaschen(fuellzeilen) === 1 ? '' : 'n') + ' &middot; ' + fuellzeilen.length + ' Füllung' + (fuellzeilen.length === 1 ? '' : 'en') + ' &middot; ' + formatiereSummenDruck(gesamtSummen) + ' gesamt</div>';
  html += '<div style="margin-top:4px;">Heute: ' + formatiereSummenDruck(zeitraeumeDruck.tag) + ' &middot; Diesen Monat: ' + formatiereSummenDruck(zeitraeumeDruck.monat) + ' &middot; Dieses Jahr: ' + formatiereSummenDruck(zeitraeumeDruck.jahr) + '</div>';
  html += '</div>';

  reihenfolge.forEach(function(standort){
    var zeilen = gruppen[standort];
    var summenStandort = summeProEinheitDruck(zeilen);
    html += '<div class="pb-fuellgruppe">';
    html += '<h3 style="margin:18px 0 6px 0; font-size:15px;">' + escapeHtml(standort) + '</h3>';
    html += '<div class="meta2" style="margin-bottom:6px;">' + anzahlFlaschen(zeilen) + ' Flasche' + (anzahlFlaschen(zeilen) === 1 ? '' : 'n') + ' &middot; ' + zeilen.length + ' Füllung' + (zeilen.length === 1 ? '' : 'en') + ' &middot; ' + formatiereSummenDruck(summenStandort) + '</div>';
    html += '<table class="pb-tabelle"><thead><tr><th>Kunde</th><th>Typ</th><th>Standort</th><th>Serien-Nr.</th><th>Datum/Uhrzeit</th><th>Menge</th></tr></thead><tbody>';
    zeilen.slice().sort(function(a,b){ return new Date(b.datum) - new Date(a.datum); }).forEach(function(z){
      html += '<tr><td>' + (z.k ? escapeHtml(z.k.name) : '-') + '</td><td>' + escapeHtml(z.g.typ || '-') + '</td><td>' + escapeHtml(z.standort || '-') + '</td><td>' + escapeHtml(z.g.seriennummer || '-') + '</td><td>' + fmtDatumZeitLokal(z.datum) + '</td><td>' + (typeof z.menge === 'number' ? (z.menge.toLocaleString('de-AT') + ' ' + z.einheit) : '-') + '</td></tr>';
    });
    html += '</tbody></table>';
    html += '</div>';
  });

  html += '<div class="bericht-fuss">Wolfgang Janiba Brandschutztechnik GmbH &middot; Ketzergasse 299, 2380 Perchtoldsdorf &middot; Tel 0676/305 83 98 &middot; info@loeschtechnik.at &middot; www.brandschutztechnik-janiba.at &middot; Druckdatum: ' + fmtDate(new Date().toISOString()) + '</div>';
  html += '</div>';
  return html;
}

function modalFuellhistorie(geraetId, zurueckKundeId){
  var g = state.geraete.filter(function(x){ return x.id === geraetId; })[0];
  if(!g) return;
  var fuellungen = (g.fuellungen || []).slice().sort(function(a,b){ return new Date(b.datum) - new Date(a.datum); });

  var html = '';
  html += '<div class="modal-head"><h3>Füllhistorie</h3><button class="close" id="mClose">&times;</button></div>';
  html += '<div class="meta" style="margin-bottom:12px;">' + escapeHtml(g.typ || '') + (g.standort ? (' &middot; ' + escapeHtml(g.standort)) : '') + '</div>';

  if(fuellungen.length === 0){
    html += '<div class="empty">Noch keine Füllungen erfasst</div>';
  } else {
    var einheitGeraet = (g.kategorie === 'CO2-Flaschen') ? 'g' : 'Liter';
    var gesamtMenge = 0;
    var hatUnbekannt = false;
    fuellungen.forEach(function(f){
      var info = fuellungLesen(f, g.kategorie, g.standort);
      if(typeof info.menge === 'number' && !isNaN(info.menge)) gesamtMenge += info.menge; else hatUnbekannt = true;
    });
    var ersteDatum = fuellungen[fuellungen.length - 1].datum;
    var letzteDatum = fuellungen[0].datum;

    html += '<div class="card">';
    html += '<div class="row"><h3>' + fuellungen.length + ' Füllung' + (fuellungen.length === 1 ? '' : 'en') + '</h3></div>';
    html += '<div class="meta">Zeitraum: ' + fmtDatumZeitLokal(ersteDatum) + ' bis ' + fmtDatumZeitLokal(letzteDatum) + '</div>';
    html += '<div class="meta">Gesamtmenge: ' + gesamtMenge.toLocaleString('de-AT') + ' ' + einheitGeraet + (hatUnbekannt ? ' (unvollständig, nicht alle Mengen bekannt)' : '') + '</div>';
    html += '</div>';

    html += '<div class="section-title" style="margin-top:16px;">Einzelne Füllungen</div>';
    fuellungen.forEach(function(f, idx){
      var infoZeile = fuellungLesen(f, g.kategorie, g.standort);
      html += '<div class="card" style="padding:10px 12px;">';
      html += '<div class="row"><span class="meta">' + fmtDatumZeitLokal(f.datum) + '</span><span class="meta">' + (typeof infoZeile.menge === 'number' ? (infoZeile.menge.toLocaleString('de-AT') + ' ' + infoZeile.einheit) : '-') + '</span></div>';
      html += '<label style="margin-top:6px; font-size:12px;">Ort dieser Füllung</label>';
      html += '<input type="text" id="fuellOrt_' + idx + '" value="' + escapeHtml(infoZeile.standort || '') + '" placeholder="z.B. Weinfest Mödling">';
      html += '<div style="display:flex; gap:8px; margin-top:6px;">';
      html += '<button type="button" class="btn small secondary" data-fuellortspeichern="' + idx + '">Ort speichern</button>';
      html += '<button type="button" class="btn small secondary" data-fuellungloeschen="' + idx + '">Löschen</button>';
      html += '</div>';
      html += '</div>';
    });
  }

  openModal(html);
  document.getElementById('mClose').onclick = function(){
    if(zurueckKundeId) modalFuellhistorieListe(zurueckKundeId); else modalGeraetBearbeiten(geraetId);
  };
  document.querySelectorAll('[data-fuellungloeschen]').forEach(function(b){
    b.onclick = function(){
      var idx = parseInt(b.getAttribute('data-fuellungloeschen'), 10);
      if(!confirm('Diese Füllung wirklich löschen?')) return;
      var sortiert = (g.fuellungen || []).slice().sort(function(a,b){ return new Date(b.datum) - new Date(a.datum); });
      var zuLoeschen = sortiert[idx];
      g.fuellungen = (g.fuellungen || []).filter(function(f){ return f !== zuLoeschen; });
      dbPut('geraete', g, function(){
        state.geraete = state.geraete.map(function(x){ return x.id === g.id ? g : x; });
        modalFuellhistorie(geraetId, zurueckKundeId);
      });
    };
  });
  document.querySelectorAll('[data-fuellortspeichern]').forEach(function(b){
    b.onclick = function(){
      var idx = parseInt(b.getAttribute('data-fuellortspeichern'), 10);
      var neuerOrt = document.getElementById('fuellOrt_' + idx).value.trim();
      var sortiert = (g.fuellungen || []).slice().sort(function(a,b){ return new Date(b.datum) - new Date(a.datum); });
      var zuAendern = sortiert[idx];
      zuAendern.standort = neuerOrt;
      dbPut('geraete', g, function(){
        state.geraete = state.geraete.map(function(x){ return x.id === g.id ? g : x; });
        toast('Ort gespeichert');
        modalFuellhistorie(geraetId, zurueckKundeId);
      });
    };
  });
}


function modalDokumenteListe(kundeId){
  var k = state.kunden.filter(function(x){ return x.id === kundeId; })[0];
  if(!k) return;
  var dokumente = state.dokumente.filter(function(d){ return d.kundeId === kundeId; })
    .slice().sort(function(a,b){ return new Date(b.datum) - new Date(a.datum); });

  var html = '';
  html += '<div class="modal-head"><h3>Dokumente</h3><button class="close" id="mClose">&times;</button></div>';
  html += '<label>PDF-Datei auswählen</label>';
  html += '<input type="file" accept="application/pdf" id="dokFile">';
  html += '<label style="margin-top:8px;">Bezeichnung</label>';
  html += '<input type="text" id="dokName" placeholder="z.B. Gesamtübersicht Brandschutzbegehung">';
  html += '<label style="margin-top:8px;">Datum</label>';
  html += '<input type="date" id="dokDatum" value="' + new Date().toISOString().substring(0,10) + '">';
  html += '<button class="btn block" id="dokHochladenBtn" style="margin-top:12px;">Dokument speichern</button>';

  html += '<div class="section-title" style="margin-top:20px;">Abgelegte Dokumente</div>';
  if(dokumente.length === 0){
    html += '<div class="empty">Noch keine Dokumente abgelegt</div>';
  } else {
    dokumente.forEach(function(d){
      html += '<div class="card">';
      html += '<div class="row"><h3>' + escapeHtml(d.name || 'Dokument') + '</h3></div>';
      html += '<div class="meta">' + fmtDate(d.datum) + '</div>';
      html += '<div style="display:flex; gap:8px; margin-top:8px;">';
      html += '<button class="btn small secondary" data-dokansehen="' + d.id + '">Öffnen</button>';
      html += '<button class="btn small" style="background:#b02a2a; color:#fff;" data-dokloeschen="' + d.id + '">Löschen</button>';
      html += '</div></div>';
    });
  }

  openModal(html);
  document.getElementById('mClose').onclick = closeModal;

  document.getElementById('dokHochladenBtn').onclick = function(){
    var fileEl = document.getElementById('dokFile');
    var file = fileEl.files && fileEl.files[0];
    if(!file){ toast('Bitte zuerst eine PDF-Datei auswählen'); return; }
    var name = document.getElementById('dokName').value.trim() || file.name;
    var datum = document.getElementById('dokDatum').value || new Date().toISOString().substring(0,10);
    var reader = new FileReader();
    reader.onload = function(){
      var dok = { id: uid(), kundeId: kundeId, name: name, datum: datum, dataUrl: reader.result };
      dbPut('dokumente', dok, function(){
        state.dokumente.push(dok);
        toast('Dokument gespeichert');
        modalDokumenteListe(kundeId);
      });
    };
    reader.readAsDataURL(file);
  };

  document.querySelectorAll('[data-dokansehen]').forEach(function(b){
    b.onclick = function(){
      var d = state.dokumente.filter(function(x){ return x.id === b.getAttribute('data-dokansehen'); })[0];
      if(!d) return;
      var w = window.open();
      try {
        var parts = d.dataUrl.split(',');
        var mimeMatch = parts[0].match(/:(.*?);/);
        var mime = mimeMatch ? mimeMatch[1] : 'application/pdf';
        var bstr = atob(parts[1]);
        var n = bstr.length;
        var u8arr = new Uint8Array(n);
        for(var i=0; i<n; i++){ u8arr[i] = bstr.charCodeAt(i); }
        var blob = new Blob([u8arr], {type: mime});
        var url = URL.createObjectURL(blob);
        if(w){ w.location.href = url; } else { window.location.href = url; }
      } catch(err){
        if(w){ w.location.href = d.dataUrl; }
      }
    };
  });
  document.querySelectorAll('[data-dokloeschen]').forEach(function(b){
    b.onclick = function(){
      var did = b.getAttribute('data-dokloeschen');
      if(!confirm('Dieses Dokument wirklich löschen?')) return;
      dbDelete('dokumente', did, function(){
        state.dokumente = state.dokumente.filter(function(x){ return x.id !== did; });
        modalDokumenteListe(kundeId);
      });
    };
  });
}
