// PIN-Prüfwert (SHA-256, mehrfach mit Salz) – im Code stehen keine PINs mehr
function pinSha256(ascii){
  var rr = function(v, n){ return (v >>> n) | (v << (32 - n)); };
  var K = pinSha256.K, H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  if(!K){
    K = pinSha256.K = [];
    var p = 2, z = 0;
    while(z < 64){
      var ist = true;
      for(var d = 2; d * d <= p; d++){ if(p % d === 0){ ist = false; break; } }
      if(ist){ K[z++] = (Math.pow(p, 1/3) * 4294967296) | 0; }
      p++;
    }
  }
  var bytes = [], i, j;
  for(i = 0; i < ascii.length; i++){ bytes.push(ascii.charCodeAt(i) & 255); }
  var bitLen = bytes.length * 8;
  bytes.push(0x80);
  while(bytes.length % 64 !== 56){ bytes.push(0); }
  for(i = 7; i >= 0; i--){ bytes.push(i >= 4 ? 0 : (bitLen >>> (i * 8)) & 255); }
  var w = [];
  for(j = 0; j < bytes.length; j += 64){
    for(i = 0; i < 16; i++){ w[i] = (bytes[j+i*4] << 24) | (bytes[j+i*4+1] << 16) | (bytes[j+i*4+2] << 8) | bytes[j+i*4+3]; }
    for(i = 16; i < 64; i++){
      var s0 = rr(w[i-15], 7) ^ rr(w[i-15], 18) ^ (w[i-15] >>> 3);
      var s1 = rr(w[i-2], 17) ^ rr(w[i-2], 19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    var a = H[0], b = H[1], c = H[2], dd = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for(i = 0; i < 64; i++){
      var t1 = h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i];
      var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c));
      h = g; g = f; f = e; e = (dd + t1) | 0; dd = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + dd) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  var hex = '';
  for(i = 0; i < 8; i++){ var x = (H[i] >>> 0).toString(16); while(x.length < 8){ x = '0' + x; } hex += x; }
  return hex;
}
function pinPruefwert(pin){
  var wert = 'janiba-bsv|' + pin;
  for(var i = 0; i < 3000; i++){ wert = pinSha256(wert + '|' + pin); }
  return wert;
}
var CHEF_PIN_PRUEFWERT = '7b0ac164b46333502459bc71928b9ba693510030212e6ac99fa58ef1a2df7a34';
var MITARBEITER = [{name:'Janiba Wolfgang sen.',pw:'b1b89ef39b06b58a21533ed951b596ec651fa17a89b69523f05cf6558777a9da'},{name:'Prominzer Tobias',pw:'d6508a86e67e359c12c96a90b69e0db0bc9a80e84e3a7585261f6c3ed6591e78'},{name:'Mayerhofer Tobias',pw:'9da01b608532bf4ef06f762aabc0a6a5783e9d3142410337ed3fe50021de91fd'},{name:'Holakovsky Manuela',pw:'acaf2507f69e9b939694c4751f6bfc7725012f9fcccb6585ca10c9a5f980ea38'},{name:'Harris Sandra',pw:'af0757f3208d062e6a6e80e4c771fce69f9dbc951daec8378c3788710015180c'},{name:'Henke Alexander',pw:'82e8e2870105ec7f465aa8c8e99b0e0a65c9713bb2ac845d48b9d51c1bfc723f'}];
var TYPEN = {kommen:'Kommen',pause_start:'Pause Beginn',pause_ende:'Pause Ende',gehen:'Gehen'};
var MONATE = ['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
var db, zeiten = [], kunden = [], me = null, ansicht = 'heute', zielName = null, mJahr, mMonat, geladen = false;
var jetztD = new Date(); mJahr = jetztD.getFullYear(); mMonat = jetztD.getMonth();

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(t){ var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function(){ e.style.display = 'none'; }, 3500); }
function uid(){ return 'id_' + Date.now() + '_' + Math.floor(Math.random() * 10000); }
function tagKey(iso){ var d = new Date(iso); var m = d.getMonth() + 1, t = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (t < 10 ? '0' : '') + t; }
function uhr(iso){ var d = new Date(iso); var h = d.getHours(), m = d.getMinutes(); return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }
function dauer(ms){ if(!ms || ms < 0) ms = 0; var min = Math.round(ms / 60000); var m = min % 60; return Math.floor(min / 60) + ':' + (m < 10 ? '0' : '') + m + ' h'; }
function namen(){ return ['Janiba Wolfgang'].concat(MITARBEITER.map(function(m){ return m.name; })); }
// Arbeitstag = Tag des "Kommen" der Schicht (auch ueber Mitternacht, z.B. 14:10 bis 03:19)
var SCHICHT_LUECKE = 20 * 3600000;
function schichtKey(z){
  var l = zeiten.filter(function(x){ return x.mitarbeiter === z.mitarbeiter && x.typ !== 'notiz'; }).sort(function(a, b){ return new Date(a.zeit) - new Date(b.zeit); });
  var offen = null, letzte = null, nachArzt = null, erg = tagKey(z.zeit);
  for(var i = 0; i < l.length; i++){
    var x = l[i], t = new Date(x.zeit), k;
    if(offen && letzte && (t - letzte) > SCHICHT_LUECKE) offen = null;
    if(!offen && nachArzt && x.typ === 'kommen' && (t - nachArzt.t) < 6 * 3600000) offen = nachArzt.k;
    nachArzt = null;
    if(!offen){ k = tagKey(x.zeit); if(x.typ !== 'gehen') offen = k; } else k = offen;
    if(x.typ === 'gehen'){ if(x.ort === 'Arzt') nachArzt = {k: k, t: t}; offen = null; }
    letzte = t;
    if(x.id === z.id){ erg = k; break; }
  }
  return erg;
}
function eintraege(name, key){ return zeiten.filter(function(z){ return z.mitarbeiter === name && (!key || schichtKey(z) === key); }).sort(function(a, b){ return new Date(a.zeit) - new Date(b.zeit); }); }
function offeneSchicht(name){
  var l = eintraege(name, null);
  if(!l.length) return null;
  var last = l[l.length - 1];
  if(last.typ === 'gehen' || (new Date() - new Date(last.zeit)) > SCHICHT_LUECKE) return null;
  return schichtKey(last);
}

function berechne(liste, bisJetzt){
  var arbeit = 0, pause = 0, arzt = 0, start = null, pS = null, pA = false, jetzt = new Date();
  liste.forEach(function(z){
    var t = new Date(z.zeit);
    if(z.typ === 'kommen'){ start = t; pS = null; }
    else if(z.typ === 'pause_start'){ if(start){ arbeit += t - start; start = null; } pS = t; pA = (z.ort === 'Arzt'); }
    else if(z.typ === 'pause_ende'){ if(pS){ pause += t - pS; if(pA) arzt += t - pS; pS = null; } start = t; }
    else if(z.typ === 'gehen'){ if(start){ arbeit += t - start; start = null; } if(pS){ pause += t - pS; if(pA) arzt += t - pS; pS = null; } }
  });
  var offen = !!(start || pS);
  if(bisJetzt){ if(start) arbeit += jetzt - start; if(pS) pause += jetzt - pS; }
  return {arbeit: arbeit, pause: pause, arzt: arzt, offen: offen};
}
function status(name){
  var l = eintraege(name, offeneSchicht(name) || tagKey(new Date().toISOString()));
  if(!l.length) return {key:'ab', label:'Nicht eingestempelt', farbe:'#888', liste:l};
  var t = l[l.length - 1].typ;
  if(t === 'gehen') return {key:'ge', label:'Feierabend', farbe:'#888', liste:l};
  if(t === 'pause_start') return {key:'pa', label:'In Pause', farbe:'#d98a00', liste:l};
  return {key:'ar', label:'Bei der Arbeit', farbe:'#2f7a4f', liste:l};
}
function ortText(z){
  if(!z || !z.ort) return '';
  if(z.ort === 'Kunde'){ var k = kunden.filter(function(x){ return x.id === z.kundeId; })[0]; return k ? k.name : 'Kunde'; }
  return z.ort;
}
function ortOptionen(vor){
  var h = '<option value="">– nicht angegeben –</option><option value="lager"' + (vor === 'lager' ? ' selected' : '') + '>Lager</option><option value="arzt"' + (vor === 'arzt' ? ' selected' : '') + '>Arzt</option><option value="sonst"' + (vor === 'sonst' ? ' selected' : '') + '>Sonstiges</option>';
  var ks = kunden.filter(function(k){ return !k.geloescht && !k.stillgelegt; }).sort(function(a, b){ return (a.name || '').localeCompare(b.name || ''); });
  if(ks.length){ h += '<optgroup label="Kunde">'; ks.forEach(function(k){ h += '<option value="k:' + esc(k.id) + '"' + (vor === 'k:' + k.id ? ' selected' : '') + '>' + esc(k.name || 'Kunde') + '</option>'; }); h += '</optgroup>'; }
  return h;
}
function ortAus(w){
  if(!w) return {ort:null, kundeId:null};
  if(w === 'lager') return {ort:'Lager', kundeId:null};
  if(w === 'arzt') return {ort:'Arzt', kundeId:null};
  if(w === 'sonst') return {ort:'Sonstiges', kundeId:null};
  if(w.indexOf('k:') === 0) return {ort:'Kunde', kundeId:w.substring(2)};
  return {ort:null, kundeId:null};
}
function mitTs(o){
  var k = {}; for(var p in o){ if(Object.prototype.hasOwnProperty.call(o, p)) k[p] = o[p]; }
  k._ts = firebase.firestore.FieldValue.serverTimestamp();
  return k;
}
function speichern(z, cb){
  // lokal sofort uebernehmen, Server bekommt es (auch bei schwachem Netz) nachgesendet
  if(!zeiten.some(function(x){ return x.id === z.id; })) zeiten.push(z);
  var fertig = false;
  var weiter = function(){ if(fertig) return; fertig = true; cb && cb(); };
  var timer = setTimeout(weiter, 3000);
  db.collection('zeiten').doc(z.id).set(mitTs(z)).then(function(){ clearTimeout(timer); weiter(); })
    .catch(function(e){ clearTimeout(timer); zeiten = zeiten.filter(function(x){ return x.id !== z.id; }); toast('Speichern fehlgeschlagen: ' + (e && e.message ? e.message : e)); render(); });
}
function loeschen(id, cb){
  db.collection('loeschungen').doc('zeiten__' + id).set({ id: 'zeiten__' + id, store: 'zeiten', docId: id, _ts: firebase.firestore.FieldValue.serverTimestamp() }).catch(function(){});
  db.collection('zeiten').doc(id).delete().then(function(){ cb && cb(); }).catch(function(e){ toast('Löschen fehlgeschlagen'); });
  zeiten = zeiten.filter(function(z){ return z.id !== id; });
}
function stempeln(name, typ, ortWert){
  var o = ortAus(ortWert);
  var z = {id: uid(), mitarbeiter: name, typ: typ, zeit: new Date().toISOString(), ort: o.ort, kundeId: o.kundeId, erstelltVon: me.name};
  speichern(z, function(){ toast(name + ': ' + TYPEN[typ] + ' ' + uhr(z.zeit)); render(); });
}

function renderLogin(){
  $('app').innerHTML = '<div class="card"><h2>PIN eingeben</h2><div class="meta">Version 07.11. 12:00 &middot; Stempeln</div>' +
    '<input type="password" id="pin" inputmode="numeric" placeholder="PIN" autocomplete="off">' +
    '<button class="btn" id="ok">Anmelden</button></div>';
  $('ok').onclick = function(){
    var p = $('pin').value.trim();
    var pw = p ? pinPruefwert(p) : '';
    if(pw && pw === CHEF_PIN_PRUEFWERT){ me = {name:'Janiba Wolfgang', chef:true}; }
    else { var m = MITARBEITER.filter(function(x){ return x.pw === pw; })[0]; if(m) me = {name:m.name, chef:false}; }
    if(!me){ toast('PIN falsch'); return; }

  };
  $('pin').onkeydown = function(e){ if(e.key === 'Enter') $('ok').click(); };

function aktionen(name, st){
  var l = st.liste.length ? st.liste[st.liste.length - 1] : null;
  var vor = l && l.ort ? (l.ort === 'Kunde' ? 'k:' + l.kundeId : (l.ort === 'Lager' ? 'lager' : (l.ort === 'Arzt' ? 'arzt' : 'sonst'))) : '';
  var h = '<label>Wo? (Kunde / Lager / Arzt)</label><select id="ort">' + ortOptionen(vor) + '</select>';
  var b = function(t, c){ return '<button class="btn ' + (c || '') + '" data-st="' + t + '">' + TYPEN[t] + '</button>'; };
  if(st.key === 'ab' || st.key === 'ge') h += b('kommen');
  else if(st.key === 'ar') h += b('pause_start', 'amber') + b('gehen', 'red');
  else h += b('pause_ende') + b('gehen', 'red');
  return h;
}

function zeitenHeute(){
  var name = zielName, st = status(name), b = berechne(st.liste, true);
  var h = '<div class="card"><h2>' + esc(name) + '</h2><div class="status" style="color:' + st.farbe + ';">' + st.label + '</div>';
  if(st.liste.length){
    h += '<div class="meta">' + st.liste.map(function(z){ return uhr(z.zeit) + ' ' + TYPEN[z.typ] + (z.ort ? ' (' + esc(ortText(z)) + ')' : ''); }).join(' &middot; ') + '</div>';
    h += '<div class="meta"><b>Arbeitszeit heute: ' + dauer(b.arbeit) + '</b> &middot; Pause: ' + dauer(b.pause) + '</div>';
  }
  h += aktionen(name, st) + '</div>';
  if(me.chef){
    h += '<div class="card"><div class="meta" style="margin-bottom:6px;">Alle Mitarbeiter heute</div>';
    namen().forEach(function(n){ var s = status(n); var bb = berechne(s.liste, true); h += '<div class="row" style="padding:5px 0;border-bottom:1px solid #eee;"><div>' + esc(n) + '</div><div style="color:' + s.farbe + ';text-align:right;">' + s.label + ' &middot; ' + dauer(bb.arbeit) + '</div></div>'; });
    h += '</div>';
  }
  return h;
}

function monat(){
  var name = zielName;
  var tage = {}; zeiten.forEach(function(z){ if(z.mitarbeiter !== name) return; var k = schichtKey(z); if(parseInt(k.substring(0, 4), 10) !== mJahr || parseInt(k.substring(5, 7), 10) - 1 !== mMonat) return; (tage[k] = tage[k] || []).push(z); });
  var keys = Object.keys(tage).sort(), sum = 0, sp = 0, sa = 0, heute = tagKey(new Date().toISOString());
  var h = '<div class="card"><div class="row" style="margin-bottom:8px;"><button class="btn grey" id="mz" style="margin:0;">&lsaquo;</button><div style="text-align:center;font-weight:700;flex:3;">' + MONATE[mMonat] + ' ' + mJahr + '</div><button class="btn grey" id="mv" style="margin:0;">&rsaquo;</button></div>';
  if(!keys.length) h += '<div class="meta">Keine Stempelzeiten in diesem Monat</div>';
  else {
    h += '<table><tr><th>Tag</th><th>Kommen</th><th>Gehen</th><th>Pause</th><th>Netto</th></tr>';
    keys.forEach(function(k){
      var l = tage[k].sort(function(a, b){ return new Date(a.zeit) - new Date(b.zeit); }), b = berechne(l, k === heute || k === offeneSchicht(name));
      sum += b.arbeit; sp += b.pause; sa += b.arzt;
      var ko = l.filter(function(z){ return z.typ === 'kommen'; })[0], ge = l.filter(function(z){ return z.typ === 'gehen'; }).pop();
      var orte = []; l.forEach(function(z){ var t = ortText(z); if(t && orte.indexOf(t) < 0) orte.push(t); });
      var d = new Date(k + 'T12:00:00'), wt = ['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()];
      h += '<tr><td>' + wt + ' ' + k.substring(8) + '.' + k.substring(5, 7) + '.' + (orte.length ? '<div class="meta">' + orte.map(esc).join(', ') + '</div>' : '') + '</td><td>' + (ko ? uhr(ko.zeit) : '-') + '</td><td>' + (ge ? uhr(ge.zeit) : ((b.offen && k !== heute) ? '<span style="color:#b02a2a;">fehlt</span>' : '-')) + '</td><td>' + dauer(b.pause) + '</td><td><b>' + dauer(b.arbeit) + '</b></td></tr>';
      if(me.chef){ h += '<tr><td colspan="5">'; l.forEach(function(z){ h += '<span class="chip" data-del="' + z.id + '">' + uhr(z.zeit) + ' ' + TYPEN[z.typ] + (z.ort ? ' (' + esc(ortText(z)) + ')' : '') + ' &times;</span>'; }); h += '</td></tr>'; }
    });
    h += '<tr><td colspan="3"><b>Summe</b></td><td><b>' + dauer(sp) + '</b></td><td><b>' + dauer(sum) + '</b></td></tr></table>';
    if(sa > 0) h += '<div class="meta">davon Arzt (in der Pause enthalten): ' + dauer(sa) + '</div>';
  }
  h += '<button class="btn grey" id="druck">Drucken / PDF</button></div>';
  if(me.chef) h += nachtragenHtml();
  return h;
}

function nachtragenHtml(){
  var heute = new Date().toISOString().substring(0, 10);
  return '<div class="card"><h2 style="font-size:17px;">Zeiten nachtragen</h2><div class="meta">für ' + esc(zielName) + '</div>' +
    '<label>Datum</label><input type="date" id="nDat" value="' + heute + '">' +
    '<div class="row"><div><label>Kommen</label><input type="time" id="nK"></div><div><label>Gehen</label><input type="time" id="nG"></div></div>' +
    '<label>Wo gearbeitet?</label><select id="nOrt">' + ortOptionen('') + '</select>' +
    '<div class="row"><div><label>Pause von</label><input type="time" id="nPV"></div><div><label>Pause bis</label><input type="time" id="nPB"></div></div>' +
    '<label>Pause für</label><select id="nPG"><option value="">Normale Pause</option><option value="arzt">Arzt</option></select>' +
    '<button class="btn" id="nSave">Speichern</button></div>';
}

function render(){
  if(!me){ renderLogin(); return; }
  var h = '<div class="row" style="margin-bottom:8px;"><div class="meta">Angemeldet: <b>' + esc(me.name) + '</b></div><button class="btn grey" id="out" style="margin:0;padding:8px;">Abmelden</button></div>';
  if(me.chef){ h += '<select id="wer" style="margin-bottom:10px;">' + namen().map(function(n){ return '<option' + (n === zielName ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select>'; }
  h += '<div class="tabs"><button data-an="heute" class="' + (ansicht === 'heute' ? 'on' : '') + '">Stempeln</button><button data-an="monat" class="' + (ansicht === 'monat' ? 'on' : '') + '">Monatsliste</button></div>';
  h += ansicht === 'heute' ? zeitenHeute() : monat();
  $('app').innerHTML = h;
  $('out').onclick = function(){ me = null; render(); };
  var w = $('wer'); if(w) w.onchange = function(){ zielName = w.value; render(); };
  document.querySelectorAll('[data-an]').forEach(function(b){ b.onclick = function(){ ansicht = b.getAttribute('data-an'); render(); }; });
  document.querySelectorAll('[data-st]').forEach(function(b){ b.onclick = function(){ b.disabled = true; stempeln(zielName, b.getAttribute('data-st'), $('ort').value); }; });
  if(ansicht === 'monat'){
    $('mz').onclick = function(){ mMonat--; if(mMonat < 0){ mMonat = 11; mJahr--; } render(); };
    $('mv').onclick = function(){ mMonat++; if(mMonat > 11){ mMonat = 0; mJahr++; } render(); };
    $('druck').onclick = function(){ window.print(); };
    document.querySelectorAll('[data-del]').forEach(function(c){ c.onclick = function(){
      if(!confirm('Stempel wirklich löschen?')) return;
      var id = c.getAttribute('data-del');
      loeschen(id); render();
    }; });
    var s = $('nSave'); if(s) s.onclick = nachtragen;
  }
}

function nachtragen(){
  var dat = $('nDat').value;
  if(!dat){ toast('Datum angeben'); return; }
  var f = {kommen:$('nK').value, pause_start:$('nPV').value, pause_ende:$('nPB').value, gehen:$('nG').value};
  var o = ortAus($('nOrt').value), pg = $('nPG').value, neu = [];
  var kVgl = f.kommen;
  if(!kVgl){ var da = eintraege(zielName, dat).filter(function(z){ return z.typ === 'kommen'; })[0]; if(da) kVgl = uhr(da.zeit); }
  var folgeTag = function(d){ var x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + 1); return tagKey(x.toISOString()); };
  ['kommen','pause_start','pause_ende','gehen'].forEach(function(t){
    if(!f[t]) return;
    var oo = (t === 'pause_start' && pg === 'arzt') ? {ort:'Arzt', kundeId:null} : o;
    neu.push({id: uid(), mitarbeiter: zielName, typ: t, zeit: new Date(((kVgl && t !== 'kommen' && f[t] < kVgl) ? folgeTag(dat) : dat) + 'T' + f[t] + ':00').toISOString(), ort: oo.ort, kundeId: oo.kundeId, erstelltVon: 'Chef (nachgetragen)'});
  });
  if(!neu.length){ toast('Bitte mindestens eine Uhrzeit eingeben'); return; }
  $('nSave').disabled = true; var fertig = 0;
  neu.forEach(function(z){ speichern(z, function(){ fertig++; if(fertig === neu.length){ var d = new Date(neu[0].zeit); mJahr = d.getFullYear(); mMonat = d.getMonth(); toast(fertig + ' Eintrag/Einträge gespeichert'); render(); } }); });
}

// ---------- Anmeldung (einmalig pro Geraet, Firmen-Konto) ----------
function renderGeraeteLogin(fertig){
  $('app').innerHTML = '<div class="card"><h2>Gerät freischalten</h2>' +
    '<div class="meta">Einmalig pro Gerät mit dem Firmen-Konto. Danach geht es wie gewohnt mit dem PIN weiter.</div>' +
    '<label>Firmen-E-Mail</label><input type="text" id="glE" autocomplete="username" autocapitalize="off" autocorrect="off" inputmode="email">' +
    '<label>Passwort</label><input type="password" id="glP" autocomplete="current-password">' +
    '<div id="glF" style="color:#b02a2a;font-size:14px;min-height:20px;margin-top:8px;"></div>' +
    '<button class="btn" id="glB">Gerät freischalten</button></div>';
  var los = function(){
    var em = $('glE').value.trim(), pw = $('glP').value, fe = $('glF'), b = $('glB');
    if(!em || !pw){ fe.textContent = 'Bitte E-Mail und Passwort eingeben.'; return; }
    b.disabled = true; b.textContent = 'Bitte warten ...'; fe.textContent = '';
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(function(){
      return firebase.auth().signInWithEmailAndPassword(em, pw);
    }).then(function(){ fertig(); }).catch(function(err){
      b.disabled = false; b.textContent = 'Gerät freischalten';
      var c = err && err.code ? err.code : '';
      if(c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-login-credentials') fe.textContent = 'E-Mail oder Passwort falsch.';
      else if(c === 'auth/network-request-failed') fe.textContent = 'Keine Internetverbindung.';
      else if(c === 'auth/too-many-requests') fe.textContent = 'Zu viele Versuche. Bitte ein paar Minuten warten.';
      else fe.textContent = 'Anmeldung fehlgeschlagen: ' + (err && err.message ? err.message : 'Unbekannt');
    });
  };
  $('glB').onclick = los;
  $('glP').onkeydown = function(e){ if(e.key === 'Enter') los(); };
}

// ---------- Sparsames Laden: Handy-Speicher + nur Aenderungen vom Server ----------
function standLesen(n){ try{ return parseInt(localStorage.getItem('stSync_' + n) || '0', 10) || 0; }catch(e){ return 0; } }
function standSetzen(n, ms){ try{ if(ms > standLesen(n)) localStorage.setItem('stSync_' + n, String(ms)); }catch(e){} }
function tsMs(t){ return t && typeof t.toMillis === 'function' ? t.toMillis() : 0; }
var neuZeichnen = null;
function spaeterRendern(){ if(neuZeichnen) return; neuZeichnen = setTimeout(function(){ neuZeichnen = null; if(me) render(); }, 150); }
// liste(): aktuelle Liste holen, setze(arr): Liste ersetzen
function sammlungSync(name, liste, setze){
  var listenerStarten = function(){
    var ab = new Date(Math.max(0, standLesen(name) - 5 * 60000));
    db.collection(name).where('_ts', '>', ab).onSnapshot(function(snap){
      var a = liste().slice(), maxT = 0, geaendert = false;
      snap.docChanges().forEach(function(ch){
        var d = ch.doc.data({ serverTimestamps: 'estimate' }); if(!d.id) d.id = ch.doc.id;
        if(!ch.doc.metadata.hasPendingWrites){ var t = tsMs(ch.doc.get('_ts')); if(t > maxT) maxT = t; }
        a = a.filter(function(x){ return x.id !== d.id; });
        if(ch.type !== 'removed') a.push(d);
        geaendert = true;
      });
      if(maxT) standSetzen(name, maxT);
      if(geaendert){ setze(a); geladen = true; spaeterRendern(); }
    }, function(e){ toast(name + ' laden fehlgeschlagen: ' + (e && e.message ? e.message : e)); });
  };
  var vonServerAlles = function(){
    var start = Date.now();
    db.collection(name).get().then(function(snap){
      var a = []; snap.forEach(function(d){ a.push(d.data()); });
      setze(a); geladen = true; spaeterRendern();
      try{ localStorage.setItem('stSync_' + name, String(start - 10 * 60000)); }catch(e){}
      listenerStarten();
    }).catch(function(e){ toast(name + ' laden fehlgeschlagen: ' + (e && e.message ? e.message : e)); });
  };
  if(standLesen(name) === 0){ vonServerAlles(); return; }
  db.collection(name).get({ source: 'cache' }).then(function(snap){
    var a = []; snap.forEach(function(d){ a.push(d.data()); });
    if(!a.length){ vonServerAlles(); return; }
    setze(a); geladen = true; spaeterRendern();
    listenerStarten();
  }).catch(function(){ vonServerAlles(); });
}
function loeschungenSync(){
  var name = 'loeschungen';
  var ab = new Date(Math.max(0, (standLesen(name) || Date.now()) - 5 * 60000));
  if(!standLesen(name)) standSetzen(name, Date.now() - 10 * 60000);
  db.collection(name).where('_ts', '>', ab).onSnapshot(function(snap){
    var maxT = 0, geaendert = false;
    snap.docChanges().forEach(function(ch){
      var v = ch.doc.data(); var t = tsMs(ch.doc.get('_ts')); if(t > maxT) maxT = t;
      if(ch.type === 'removed' || !v || !v.docId) return;
      if(v.store === 'zeiten' && zeiten.some(function(z){ return z.id === v.docId; })){
        zeiten = zeiten.filter(function(z){ return z.id !== v.docId; }); geaendert = true;
        db.collection('zeiten').doc(v.docId).get({ source: 'server' }).catch(function(){});
      }
    });
    if(maxT) standSetzen(name, maxT);
    if(geaendert) spaeterRendern();
  }, function(){});
}

function datenStarten(){
  sammlungSync('zeiten', function(){ return zeiten; }, function(a){ zeiten = a; });
  sammlungSync('kunden', function(){ return kunden; }, function(a){ kunden = a; });
  loeschungenSync();
  render();
}

try {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  try{ db.enablePersistence({ synchronizeTabs: true }).catch(function(){}); }catch(e){}
  var erledigt = false;
  firebase.auth().onAuthStateChanged(function(user){
    if(erledigt) return;
    if(user){ erledigt = true; datenStarten(); }
    else renderGeraeteLogin(function(){ erledigt = true; datenStarten(); });
  });
} catch(e){ $('app').innerHTML = '<div class="card">Fehler beim Start: ' + esc(e.message) + '</div>'; }
</script>
