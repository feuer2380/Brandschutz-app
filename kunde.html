<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prüfstatus - Wolfgang Janiba Brandschutztechnik GmbH</title>
<link rel="icon" href="data:,">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f2ef;
    color: #2a2622;
    padding: 16px;
  }
  .kopf {
    text-align: center;
    padding: 10px 0 18px 0;
  }
  .kopf h1 {
    font-size: 17px;
    margin: 4px 0 0 0;
    color: #c23f12;
  }
  .kopf .sub {
    font-size: 12px;
    color: #6b6258;
    margin-top: 2px;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    max-width: 480px;
    margin: 0 auto 14px auto;
  }
  .card h2 {
    font-size: 18px;
    margin: 0 0 4px 0;
  }
  .zeile {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    border-top: 1px solid #eee;
    font-size: 14px;
  }
  .zeile:first-of-type { border-top: none; }
  .zeile .label { color: #6b6258; }
  .zeile .wert { font-weight: 600; text-align: right; }
  .badge {
    display: inline-block;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    margin-top: 6px;
  }
  .badge.ok { background: #e3f3e6; color: #226b32; }
  .badge.soon { background: #fdf1d8; color: #8a5a00; }
  .badge.warn { background: #fbe2db; color: #a3300d; }
  .meta { font-size: 12px; color: #6b6258; margin-top: 10px; line-height: 1.4; }
  .zustand { text-align: center; padding: 40px 16px; color: #6b6258; font-size: 14px; }
  .kontakt {
    max-width: 480px;
    margin: 20px auto 0 auto;
    text-align: center;
    font-size: 12px;
    color: #6b6258;
    line-height: 1.5;
  }
  .geraeteliste-zeile {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid #eee;
    font-size: 13px;
  }
  .geraeteliste-zeile:first-of-type { border-top: none; }
  .geraeteliste-zeile .gl-name { font-weight: 600; }
  .geraeteliste-zeile .gl-meta { font-size: 11px; color: #6b6258; }
  .btn-druck {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #2a2622;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
  }
  #druckBereich { display: none; }
  @media print {
    body > *:not(#druckBereich) { display: none !important; }
    #druckBereich { display: block !important; }
    body { background: #fff; padding: 0; }
  }
  #druckBereich table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 14px; }
  #druckBereich th, #druckBereich td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
  #druckBereich th { background: #f0f0f0; }
</style>
</head>
<body>
<div class="kopf">
  <h1>Wolfgang Janiba Brandschutztechnik GmbH</h1>
  <div class="sub">Prüfstatus Ihrer Anlage</div>
</div>
<div id="inhalt"><div class="zustand">Lädt&hellip;</div></div>
<div class="kontakt">
  Wolfgang Janiba Brandschutztechnik GmbH &middot; Ketzergasse 299, 2380 Perchtoldsdorf<br>
  Tel 0676/305 83 98 &middot; info@loeschtechnik.at
</div>
<div id="druckBereich"></div>

<script>
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyBLcQlXeHcwN-4XXL6Wx7dcpN_bZQhK3_o",
  authDomain: "brandschutz-janiba.firebaseapp.com",
  projectId: "brandschutz-janiba",
  storageBucket: "brandschutz-janiba.firebasestorage.app",
  messagingSenderId: "466445019724",
  appId: "1:466445019724:web:7ed71b28e85b39cf5d62e9"
};

function escapeHtml(s){
  var d = document.createElement('div');
  d.textContent = (s === undefined || s === null) ? '' : String(s);
  return d.innerHTML;
}

function fmtDate(iso){
  if(!iso) return '-';
  var teile = iso.substring(0,10).split('-');
  if(teile.length !== 3) return iso;
  return teile[2] + '.' + teile[1] + '.' + teile[0];
}

function daysUntil(iso){
  var heute = new Date();
  heute.setHours(0,0,0,0);
  var d = new Date(iso);
  return Math.round((d - heute) / 86400000);
}

function statusBadge(iso){
  if(!iso) return { cls: 'ok', label: 'Kein Termin hinterlegt' };
  var du = daysUntil(iso);
  if(du < 0) return { cls: 'warn', label: 'Prüfung überfällig' };
  if(du <= 30) return { cls: 'soon', label: 'Prüfung bald fällig (' + du + ' Tage)' };
  return { cls: 'ok', label: 'In Ordnung' };
}

function zeigeFehler(text){
  document.getElementById('inhalt').innerHTML = '<div class="zustand">' + escapeHtml(text) + '</div>';
}

function render(g){
  var st = statusBadge(g.naechstePruefung);
  var html = '<div class="card">';
  html += '<h2>' + escapeHtml(g.typ || g.kategorie || 'Gerät') + '</h2>';
  if(g.kundenname) html += '<div class="meta" style="margin-top:0;">' + escapeHtml(g.kundenname) + '</div>';
  html += '<span class="badge ' + st.cls + '">' + escapeHtml(st.label) + '</span>';
  html += '<div style="margin-top:14px;">';
  if(g.standort) html += '<div class="zeile"><span class="label">Standort</span><span class="wert">' + escapeHtml(g.standort) + '</span></div>';
  html += '<div class="zeile"><span class="label">Letzte Prüfung</span><span class="wert">' + fmtDate(g.letztePruefung) + '</span></div>';
  html += '<div class="zeile"><span class="label">Nächste Prüfung</span><span class="wert">' + fmtDate(g.naechstePruefung) + '</span></div>';
  if(g.innenrevisionNoetig){
    html += '<div class="zeile"><span class="label">Innenrevision</span><span class="wert">' + escapeHtml(g.innenrevisionLabel || '-') + '</span></div>';
    if(g.letzteInnenrevision){
      html += '<div class="zeile"><span class="label">Innenrevision zuletzt</span><span class="wert">' + fmtDate(g.letzteInnenrevision) + '</span></div>';
    }
  }
  html += '</div>';
  html += '<div class="meta">Diese Ansicht wird automatisch aktualisiert, sobald bei Ihnen eine Prüfung durchgeführt wurde.</div>';
  html += '</div>';
  html += '<div id="alleGeraeteBereich"></div>';
  document.getElementById('inhalt').innerHTML = html;
  protokolliereZugriff(g);
  ladeAlleGeraete(g);
}

function ladeAlleGeraete(g){
  if(!g.zugangscode) return;
  firebase.firestore().collection('oeffentlich_geraete').where('zugangscode', '==', g.zugangscode).get().then(function(snap){
    var alle = [];
    snap.forEach(function(doc){ alle.push(doc.data()); });
    if(alle.length <= 1) return;
    alle.sort(function(a,b){ return (a.standort || '').localeCompare(b.standort || ''); });
    zeigeGeraeteliste(alle, g.kundenname);
    baueDruckbereich(alle, g.kundenname);
  }).catch(function(err){ console.error('Geräteliste-Fehler', err); });
}

function zeigeGeraeteliste(alle, kundenname){
  var html = '<div class="card">';
  html += '<h2 style="margin-bottom:6px;">Alle Ihre Geräte (' + alle.length + ')</h2>';
  alle.forEach(function(x){
    var st = statusBadge(x.naechstePruefung);
    html += '<div class="geraeteliste-zeile">';
    html += '<div><div class="gl-name">' + escapeHtml(x.typ || x.kategorie || 'Gerät') + '</div><div class="gl-meta">' + escapeHtml(x.standort || '') + '</div></div>';
    html += '<span class="badge ' + st.cls + '" style="margin-top:0;">' + escapeHtml(st.label) + '</span>';
    html += '</div>';
  });
  html += '<button class="btn-druck" id="druckBtn">Prüfbericht als PDF speichern</button>';
  html += '<div class="meta">Öffnet die Druckansicht Ihres Geräts/Browsers &ndash; dort "Als PDF sichern" bzw. "In Dateien sichern" wählen.</div>';
  html += '</div>';
  document.getElementById('alleGeraeteBereich').innerHTML = html;
  document.getElementById('druckBtn').onclick = function(){ window.print(); };
}

function baueDruckbereich(alle, kundenname){
  var heute = new Date();
  var heuteStr = fmtDate(heute.toISOString());
  var html = '';
  html += '<div style="padding:24px; font-family:-apple-system,Arial,sans-serif;">';
  html += '<h1 style="font-size:18px; color:#c23f12; margin-bottom:2px;">Wolfgang Janiba Brandschutztechnik GmbH</h1>';
  html += '<div style="font-size:12px; color:#555; margin-bottom:16px;">Ketzergasse 299, 2380 Perchtoldsdorf &middot; Tel 0676/305 83 98 &middot; info@loeschtechnik.at</div>';
  html += '<h2 style="font-size:15px; margin-bottom:2px;">Prüfbericht &ndash; Geräteübersicht</h2>';
  html += '<div style="font-size:12px; color:#555; margin-bottom:10px;">Kunde: ' + escapeHtml(kundenname || '') + ' &middot; Stand: ' + heuteStr + '</div>';
  html += '<table><thead><tr><th>Typ</th><th>Standort</th><th>Letzte Prüfung</th><th>Nächste Prüfung</th><th>Status</th></tr></thead><tbody>';
  alle.forEach(function(x){
    var st = statusBadge(x.naechstePruefung);
    html += '<tr><td>' + escapeHtml(x.typ || x.kategorie || '') + '</td><td>' + escapeHtml(x.standort || '') + '</td><td>' + fmtDate(x.letztePruefung) + '</td><td>' + fmtDate(x.naechstePruefung) + '</td><td>' + escapeHtml(st.label) + '</td></tr>';
  });
  html += '</tbody></table>';
  html += '<div style="font-size:11px; color:#888; margin-top:16px;">Automatisch erstellter Prüfbericht aus dem Kundenportal von Wolfgang Janiba Brandschutztechnik GmbH, ersetzt keine offiziellen Prüfprotokolle.</div>';
  html += '</div>';
  document.getElementById('druckBereich').innerHTML = html;
}

function protokolliereZugriff(g){
  try {
    var schonProtokolliert = sessionStorage.getItem('protokolliert_' + g.id);
    if(schonProtokolliert) return;
    sessionStorage.setItem('protokolliert_' + g.id, '1');
  } catch(e){}
  try {
    firebase.firestore().collection('portal_zugriffe').add({
      geraetId: g.id,
      kundenname: g.kundenname || '',
      typ: g.typ || '',
      standort: g.standort || '',
      zeitpunkt: new Date().toISOString()
    }).catch(function(err){ console.error('Protokoll-Fehler', err); });
  } catch(e){}
}

function start(){
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  if(!id){
    zeigeFehler('Kein Gerät angegeben. Bitte den QR-Code am Feuerlöscher erneut scannen.');
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    var db = firebase.firestore();
    db.collection('oeffentlich_geraete').doc(id).get().then(function(doc){
      if(!doc.exists){
        zeigeFehler('Für dieses Gerät sind aktuell keine Daten freigegeben. Bitte kontaktieren Sie Wolfgang Janiba Brandschutztechnik GmbH.');
        return;
      }
      var g = doc.data();
      if(g.zugangscode){
        var freigeschaltet = false;
        try { freigeschaltet = sessionStorage.getItem('zugang_' + id) === normalisiereCode(g.zugangscode); } catch(e){}
        if(freigeschaltet){
          render(g);
        } else {
          zeigeZugangsAbfrage(g, id);
        }
      } else {
        render(g);
      }
    }).catch(function(err){
      console.error(err);
      zeigeFehler('Die Daten konnten nicht geladen werden. Bitte Internetverbindung prüfen und Seite neu laden.');
    });
  } catch(err){
    console.error(err);
    zeigeFehler('Verbindung fehlgeschlagen. Bitte Seite neu laden.');
  }
}

function normalisiereCode(s){
  return String(s || '').trim().toLowerCase().replace(/\s+/g, '');
}

function zeigeZugangsAbfrage(g, id){
  var html = '<div class="card">';
  html += '<h2>Zugangscode</h2>';
  html += '<div class="meta" style="margin-top:0;">Bitte den Zugangscode eingeben, den Sie von Wolfgang Janiba Brandschutztechnik GmbH erhalten haben.</div>';
  html += '<input id="pinInput" type="text" autocapitalize="characters" placeholder="z.B. X7K2P9" style="width:100%; margin-top:14px; padding:12px; font-size:18px; text-align:center; letter-spacing:2px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;">';
  html += '<button id="pinBtn" style="width:100%; margin-top:12px; padding:12px; border:none; border-radius:8px; background:#c23f12; color:#fff; font-weight:700; font-size:15px;">Bestätigen</button>';
  html += '<div id="pinFehler" class="meta" style="color:#a3300d; margin-top:8px; display:none;">Zugangscode nicht erkannt, bitte erneut versuchen.</div>';
  html += '</div>';
  document.getElementById('inhalt').innerHTML = html;
  var input = document.getElementById('pinInput');
  input.focus();
  var pruefen = function(){
    if(normalisiereCode(input.value) === normalisiereCode(g.zugangscode)){
      try { sessionStorage.setItem('zugang_' + id, normalisiereCode(g.zugangscode)); } catch(e){}
      render(g);
    } else {
      document.getElementById('pinFehler').style.display = 'block';
      input.value = '';
      input.focus();
    }
  };
  document.getElementById('pinBtn').onclick = pruefen;
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') pruefen(); });
}

start();
</script>
</body>
</html>
