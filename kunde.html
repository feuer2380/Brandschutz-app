<style>

  .meta { font-size: 12px; color: #6b6258; margin-top: 10px; line-height: 1.4; }
  .zustand { text-align: center; padding: 40px 16px; color: #6b6258; font-size: 14px; }
  .kontakt {

    background: #2a2622;

    font-weight: 700;
    font-size: 14px;
  }
  #druckBereich { display: none; }
  @page { size: A4 portrait; margin: 12mm; }
  @media print {
    html, body { height: auto !important; overflow: visible !important; }
    body > *:not(#druckBereich) { display: none !important; }
    #druckBereich { display: block !important; }
    body { background: #fff; padding: 0; margin: 0; }
    #druckBereich, #druckBereich * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  #druckBereich table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 12px; table-layout: fixed; }
  #druckBereich thead { display: table-header-group; }
  #druckBereich tr { page-break-inside: avoid; break-inside: avoid; }
  #druckBereich th, #druckBereich td { border: 1px solid #ccc; padding: 5px 6px; text-align: left; vertical-align: top; word-wrap: break-word; overflow-wrap: break-word; }
  #druckBereich th { background: #f0f0f0; }
  #druckBereich .kopfblock { page-break-after: avoid; break-after: avoid; }

<script>
var FIREBASE_CONFIG = {

function escapeHtml(s){
  var d = document.createElement('div');
  d.textContent = (s === undefined || s === null) ? '' : String(s);
  return d.innerHTML;
}

function fmtDate(iso){
  if(!iso) return '-';
  var teile = iso.substring(0,10).split('-');
  if(teile.length !== 3) return iso;
  return teile[2] + '.' + teile[1] + '.' + teile[0];
}

function daysUntil(iso){
  var heute = new Date();
  heute.setHours(0,0,0,0);
  var d = new Date(iso);
  return Math.round((d - heute) / 86400000);
}

function statusBadge(iso){
  if(!iso) return { cls: 'ok', label: 'Kein Termin hinterlegt' };
  var du = daysUntil(iso);
  if(du < 0) return { cls: 'warn', label: 'Prüfung überfällig' };
  if(du <= 30) return { cls: 'soon', label: 'Prüfung bald fällig (' + du + ' Tage)' };
  return { cls: 'ok', label: 'In Ordnung' };
}

function zeigeFehler(text){
  document.getElementById('inhalt').innerHTML = '<div class="zustand">' + escapeHtml(text) + '</div>';
}

// Hinweis fluorhaltiges Loeschmittel (PFAS), Frist 31.12.2030 (EU-VO 2025/1988)
function fluorHinweisVoll(g){
  if(!g || !g.fluorStufe) return '';
  var jetzt = !!g.fluorJetzt;
  var h = '<div style="margin-top:12px; border-radius:10px; padding:11px 13px; font-size:13px; line-height:1.45; ' + (jetzt ? 'background:#fbe2db; border:1.5px solid #b3261e; color:#5a1208;' : 'background:#fdf1d8; border:1.5px solid #d39a00; color:#4a3500;') + '">';
  h += '<b>' + (jetzt ? '&#9888; Umstellung jetzt empfohlen' : 'Hinweis: fluorhaltiges Löschmittel') + '</b><br>';
  h += 'Dieses Gerät enthält ein fluorhaltiges Löschmittel (PFAS). Laut EU-Verordnung 2025/1988 darf es nur noch bis <b>31.12.2030</b> verwendet werden. ';
  if(jetzt) h += 'Da die Innenrevision ansteht, empfehlen wir die Umstellung auf ein fluorfreies Gerät bei der nächsten Wartung.';
  else if(g.fluorJahr) h += 'Wir empfehlen die Umstellung auf ein fluorfreies Gerät bei der Innenrevision ' + escapeHtml(String(g.fluorJahr)) + '.';
  else h += 'Wir empfehlen eine rechtzeitige Umstellung auf ein fluorfreies Gerät.';
  h += '<br>Wir beraten Sie gerne: <a href="tel:06763058398" style="color:inherit; font-weight:700;">0676/305 83 98</a></div>';
  return h;
}
function fluorHinweisKurz(x){
  if(!x || !x.fluorStufe) return '';
  return '<div class="gl-meta" style="color:' + (x.fluorJetzt ? '#b3261e' : '#9a6a00') + '; font-weight:700;">' + (x.fluorJetzt ? 'fluorhaltig &ndash; Umstellung jetzt empfohlen' : 'fluorhaltig &ndash; Umstellung bis 2030') + '</div>';
}

function render(g, schluessel){
  var st = statusBadge(g.naechstePruefung);
  var html = '<div class="card">';
  html += '<h2>' + escapeHtml(g.typ || g.kategorie || 'Gerät') + '</h2>';
  if(g.kundenname) html += '<div class="meta" style="margin-top:0;">' + escapeHtml(g.kundenname) + '</div>';
  html += '<span class="badge ' + st.cls + '">' + escapeHtml(st.label) + '</span>';
  html += '<div style="margin-top:14px;">';
  if(g.standort) html += '<div class="zeile"><span class="label">Standort</span><span class="wert">' + escapeHtml(g.standort) + '</span></div>';
  html += '<div class="zeile"><span class="label">Letzte Prüfung</span><span class="wert">' + fmtDate(g.letztePruefung) + '</span></div>';
  html += '<div class="zeile"><span class="label">Nächste Prüfung</span><span class="wert">' + fmtDate(g.naechstePruefung) + '</span></div>';
  if(g.innenrevisionNoetig){
    html += '<div class="zeile"><span class="label">Innenrevision</span><span class="wert">' + escapeHtml(String(g.innenrevisionLabel || '-').replace(/^Innenrevision:\s*/, '')) + '</span></div>';
    if(g.letzteInnenrevision){
      html += '<div class="zeile"><span class="label">Innenrevision zuletzt</span><span class="wert">' + fmtDate(g.letzteInnenrevision) + '</span></div>';
    }
  }
  html += '</div>';
  html += fluorHinweisVoll(g);
  html += '<button class="btn-druck" id="einzelDruckBtn">Prüfbericht für dieses Gerät</button>';
  html += '<div class="meta">Diese Ansicht wird automatisch aktualisiert, sobald bei Ihnen eine Prüfung durchgeführt wurde.</div>';
  html += '</div>';
  html += '<div id="alleGeraeteBereich"></div>';
  document.getElementById('inhalt').innerHTML = html;
  druckKnopf('einzelDruckBtn', [g], g.kundenname, gruppeVon(g), true);
  protokolliereZugriff(g);
  ladeAlleGeraete(g, schluessel);
}

// Der Kunde sieht nur Geraete aus demselben Bereich wie das gescannte Geraet
// (Feuerloescher nur Feuerloescher, Sodawasser/CO2 nur Sodawasser/CO2 usw.)
function gruppeVon(x){
  var k = String((x && x.kategorie) || 'Feuerlöscher').trim();
  if(k === 'Perchtl Zisch' || k === 'CO2-Flaschen') return 'zisch';
  // Sicherheitsnetz: Geraete mit Gramm-Angabe (z. B. "2000g", "425g") oder Soda im Namen
  // sind CO2-/Sodaflaschen, auch wenn in der App versehentlich "Feuerloescher" eingetragen ist.
  // (Feuerloescher werden immer in kg angegeben, daher kein Verwechseln mit "CO2-Loescher 5kg".)
  if(k === 'Feuerlöscher'){
    var t = String((x && x.typ) || '');
    if(/\d\s*g(\b|$)/i.test(t) && !/\d\s*kg/i.test(t)) return 'zisch';
    if(/soda|zisch|blubber/i.test(t)) return 'zisch';
  }
  return k;
}
function gruppenTitel(gr, anzahl){
  if(gr === 'zisch') return 'Ihre Sodawasser- und CO2-Flaschen';
  if(gr === 'Feuerlöscher') return 'Ihre Feuerlöscher';
  if(gr === 'Brandschutzbegehung') return 'Ihre Brandschutzbegehungen';
  return 'Ihre Geräte: ' + gr;
}
function berichtTitel(gr){
  if(gr === 'zisch') return 'Sodawasser- und CO2-Flaschen';
  return gr;
}
function ladeAlleGeraete(g, schluessel){
  var gruppe = gruppeVon(g);
  var abfrage;
  if(schluessel){
    abfrage = firebase.firestore().collection('portal').doc(schluessel).collection('geraete').get();
  } else if(g.zugangscode){
    // Uebergangszeit: alte Ablage, bis die App alles umgestellt hat
    abfrage = firebase.firestore().collection('oeffentlich_geraete').where('zugangscode', '==', g.zugangscode).get();
  } else {
    zeigeGeraeteliste([g], g.kundenname, gruppe);
    return;
  }
  abfrage.then(function(snap){
    var alle = [];
    snap.forEach(function(doc){
      var d = doc.data();
      if(gruppeVon(d) === gruppe) alle.push(d);
    });
    if(alle.length === 0) alle.push(g);
    alle.sort(function(a,b){ return (a.standort || '').localeCompare(b.standort || ''); });
    zeigeGeraeteliste(alle, g.kundenname, gruppe);
  }).catch(function(err){ console.error('Geräteliste-Fehler', err); });
}

function zeigeGeraeteliste(alle, kundenname, gruppe){
  var html = '<div class="card">';
  html += '<h2 style="margin-bottom:6px;">' + escapeHtml(gruppenTitel(gruppe)) + ' (' + alle.length + ')</h2>';
  alle.forEach(function(x){
    var st = statusBadge(x.naechstePruefung);
    html += '<div class="geraeteliste-zeile">';
    html += '<div><div class="gl-name">' + escapeHtml(x.typ || x.kategorie || 'Gerät') + '</div><div class="gl-meta">' + escapeHtml(x.standort || '') + '</div>' + fluorHinweisKurz(x) + '</div>';
    html += '<span class="badge ' + st.cls + '" style="margin-top:0;">' + escapeHtml(st.label) + '</span>';
    html += '</div>';
  });
  html += '<button class="btn-druck" id="druckBtn">Gesamtbericht: ' + escapeHtml(berichtTitel(gruppe)) + ' (' + alle.length + ')</button>';
  html += '<div class="meta">Erstellt ein PDF &ndash; danach können Sie es drucken, in Dateien sichern oder per Mail senden.</div>';
  html += '</div>';
  document.getElementById('alleGeraeteBereich').innerHTML = html;
  druckKnopf('druckBtn', alle, kundenname, gruppe, false);
}

function druckKnopf(knopfId, liste, kundenname, gruppe, einzeln){
  var b = document.getElementById(knopfId);
  if(!b) return;
  b.onclick = function(){
    // Schnellweg: PDF direkt im Browser erzeugen (ohne die langsame Druckvorschau)
    if(window.jspdf && window.jspdf.jsPDF){
      try{
        var erg = erzeugePruefberichtPdf(liste, kundenname, gruppe, einzeln);
        pdfAnbieten(erg.blob, erg.dateiname);
        return;
      }catch(e){ console.error('PDF-Fehler', e); }
    }
    // Ersatzweg: normale Druckansicht
    var alt = b.textContent;
    b.disabled = true; b.textContent = 'Bericht wird vorbereitet ...'; b.style.opacity = '0.6';
    baueDruckbereich(liste, kundenname, gruppe, einzeln);
    setTimeout(function(){
      try{ window.print(); }catch(e){}
      setTimeout(function(){ b.disabled = false; b.textContent = alt; b.style.opacity = ''; }, 1500);
    }, 60);
  };
}

function pdfAnbieten(blob, dateiname){
  var datei = null;
  try{ datei = new File([blob], dateiname, { type: 'application/pdf' }); }catch(e){}
  if(datei && navigator.canShare && navigator.share){
    try{
      if(navigator.canShare({ files: [datei] })){
        navigator.share({ files: [datei], title: dateiname }).catch(function(){});
        return;
      }
    }catch(e){}
  }
  var url = URL.createObjectURL(blob);
  var w = null;
  try{ w = window.open(url, '_blank'); }catch(e){}
  if(!w){
    var a = document.createElement('a');
    a.href = url; a.download = dateiname; a.target = '_blank';
    document.body.appendChild(a); a.click(); a.remove();
  }
  setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} }, 60000);
}

function erzeugePruefberichtPdf(alle, kundenname, gruppe, einzeln){
  var doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  var mitIR = (gruppe === 'Feuerlöscher');
  var links = 14, rechts = 196, breite = rechts - links, unten = 280;
  var heuteStr = fmtDate(new Date().toISOString());
  var titel = einzeln ? 'Prüfbericht – Einzelgerät' : ('Prüfbericht – ' + berichtTitel(gruppe) + ' (Gesamt)');

  // Kopf
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(194, 63, 18);
  doc.text('Wolfgang Janiba Brandschutztechnik GmbH', links, 18);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90, 90, 90);
  doc.text('Ketzergasse 299, 2380 Perchtoldsdorf · Tel 0676/305 83 98 · info@loeschtechnik.at', links, 23.5);
  doc.setDrawColor(194, 63, 18); doc.setLineWidth(0.6); doc.line(links, 26.5, rechts, 26.5);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(30, 30, 30);
  doc.text(titel, links, 35);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(90, 90, 90);
  doc.text('Kunde: ' + (kundenname || '') + (einzeln ? '' : ' · Anzahl: ' + alle.length) + ' · Stand: ' + heuteStr, links, 40.5);

  // Spalten
  var spalten = mitIR
    ? [[['Typ'], 0.25], [['Standort'], 0.21], [['Letzte', 'Prüfung'], 0.12], [['Nächste', 'Prüfung'], 0.12], [['Innen-', 'revision'], 0.11], [['Status'], 0.19]]
    : [[['Typ'], 0.30], [['Standort'], 0.25], [['Letzte', 'Prüfung'], 0.13], [['Nächste', 'Prüfung'], 0.13], [['Status'], 0.19]];
  var xs = [], x = links;
  for(var c = 0; c < spalten.length; c++){ xs.push(x); x += spalten[c][1] * breite; }
  var pad = 1.6, zeilenH = 4.2;

  var kopfZeichnen = function(y){
    var kh = 10;
    doc.setFillColor(238, 238, 238); doc.rect(links, y, breite, kh, 'F');
    doc.setDrawColor(200, 200, 200); doc.setLineWidth(0.2); doc.rect(links, y, breite, kh);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(30, 30, 30);
    for(var i = 0; i < spalten.length; i++){
      if(i > 0) doc.line(xs[i], y, xs[i], y + kh);
      var zeilen = spalten[i][0];
      var ty = (zeilen.length === 1) ? y + 6.2 : y + 4.3;
      doc.text(zeilen, xs[i] + pad, ty);
    }
    return y + kh;
  };

  var y = kopfZeichnen(45);
  doc.setFontSize(8.5);
  var fluorAnzahl = 0;
  for(var r = 0; r < alle.length; r++){
    var g = alle[r];
    var st = statusBadge(g.naechstePruefung);
    var ir = g.innenrevisionNoetig ? String(g.innenrevisionLabel || '').replace(/^Innenrevision:\s*/, '') : '-';
    var werte = [(g.typ || g.kategorie || '') + (g.fluorStufe ? (g.fluorJetzt ? ' (fluorhaltig - jetzt umstellen)' : ' (fluorhaltig - bis 2030 umstellen)') : ''), g.standort || '', fmtDate(g.letztePruefung), fmtDate(g.naechstePruefung)];
    if(g.fluorStufe) fluorAnzahl++;
    if(mitIR) werte.push(ir);
    werte.push(st.label);
    doc.setFont('helvetica', 'normal');
    var zellen = [], maxZ = 1;
    for(var j = 0; j < werte.length; j++){
      var zl = doc.splitTextToSize(String(werte[j]), spalten[j][1] * breite - 2 * pad);
      zellen.push(zl);
      if(zl.length > maxZ) maxZ = zl.length;
    }
    var h = maxZ * zeilenH + 2.6;
    if(y + h > unten){ doc.addPage(); y = kopfZeichnen(15); }
    doc.setDrawColor(200, 200, 200); doc.setLineWidth(0.2); doc.rect(links, y, breite, h);
    for(var k = 0; k < zellen.length; k++){
      if(k > 0) doc.line(xs[k], y, xs[k], y + h);
      var istStatus = (k === zellen.length - 1);
      if(istStatus){
        if(st.cls === 'warn') doc.setTextColor(163, 48, 13);
        else if(st.cls === 'soon') doc.setTextColor(138, 90, 0);
        else doc.setTextColor(34, 107, 50);
        doc.setFont('helvetica', 'bold');
      } else { doc.setTextColor(30, 30, 30); doc.setFont('helvetica', 'normal'); }
      doc.text(zellen[k], xs[k] + pad, y + 4.6);
    }
    y += h;
  }
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(130, 130, 130);
  if(fluorAnzahl){
    var fl = doc.splitTextToSize(fluorAnzahl + (fluorAnzahl === 1 ? ' Gerät enthält' : ' Geräte enthalten') + ' fluorhaltiges Löschmittel (PFAS). Laut EU-Verordnung 2025/1988 dürfen diese nur noch bis 31.12.2030 verwendet werden. Wir beraten Sie gerne zur Umstellung auf fluorfreie Geräte: Tel 0676/305 83 98.', breite);
    if(y + 12 > unten){ doc.addPage(); y = 15; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(163, 48, 13);
    doc.text(fl, links, y + 6);
    y += fl.length * 3.8 + 3;
  }
  var hinweis = doc.splitTextToSize('Automatisch erstellter Prüfbericht aus dem Kundenportal von Wolfgang Janiba Brandschutztechnik GmbH, ersetzt keine offiziellen Prüfprotokolle.', breite);
  if(y + 10 > unten){ doc.addPage(); y = 15; }
  doc.text(hinweis, links, y + 6);

  // Seitenzahlen
  var seiten = doc.getNumberOfPages();
  for(var p = 1; p <= seiten; p++){
    doc.setPage(p);
    doc.setFontSize(8); doc.setTextColor(130, 130, 130);
    doc.text('Seite ' + p + ' von ' + seiten, rechts, 290, { align: 'right' });
  }
  var name = (kundenname || 'Kunde').replace(/[^A-Za-z0-9ÄÖÜäöüß_-]+/g, '_');
  var dateiname = 'Pruefbericht_' + (einzeln ? 'Geraet' : berichtTitel(gruppe).replace(/[^A-Za-z0-9ÄÖÜäöüß]+/g, '_')) + '_' + name + '_' + heuteStr.replace(/\./g, '-') + '.pdf';
  dateiname = dateiname.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss');
  return { blob: doc.output('blob'), dateiname: dateiname };
}

function baueDruckbereich(alle, kundenname, gruppe, einzeln){
  var mitIR = (gruppe === 'Feuerlöscher');
  var heute = new Date();
  var heuteStr = fmtDate(heute.toISOString());
  var html = '';
  html += '<div style="padding:0; font-family:-apple-system,Arial,sans-serif;"><div class="kopfblock">';
  html += '<h1 style="font-size:18px; color:#c23f12; margin-bottom:2px;">Wolfgang Janiba Brandschutztechnik GmbH</h1>';
  html += '<div style="font-size:12px; color:#555; margin-bottom:16px;">Ketzergasse 299, 2380 Perchtoldsdorf &middot; Tel 0676/305 83 98 &middot; info@loeschtechnik.at</div>';
  if(einzeln){
    html += '<h2 style="font-size:15px; margin-bottom:2px;">Prüfbericht &ndash; Einzelgerät</h2>';
    html += '<div style="font-size:12px; color:#555; margin-bottom:10px;">Kunde: ' + escapeHtml(kundenname || '') + ' &middot; Stand: ' + heuteStr + '</div></div>';
  } else {
    html += '<h2 style="font-size:15px; margin-bottom:2px;">Prüfbericht &ndash; ' + escapeHtml(berichtTitel(gruppe)) + ' (Gesamt)</h2>';
    html += '<div style="font-size:12px; color:#555; margin-bottom:10px;">Kunde: ' + escapeHtml(kundenname || '') + ' &middot; Anzahl: ' + alle.length + ' &middot; Stand: ' + heuteStr + '</div></div>';
  }
  html += '<table><colgroup>';
  if(mitIR) html += '<col style="width:24%"><col style="width:20%"><col style="width:12%"><col style="width:12%"><col style="width:14%"><col style="width:18%">';
  else html += '<col style="width:30%"><col style="width:24%"><col style="width:14%"><col style="width:14%"><col style="width:18%">';
  html += '</colgroup><thead><tr><th>Typ</th><th>Standort</th><th>Letzte Prüfung</th><th>Nächste Prüfung</th>' + (mitIR ? '<th>Innenrevision</th>' : '') + '<th>Status</th></tr></thead><tbody>';
  alle.forEach(function(x){
    var st = statusBadge(x.naechstePruefung);
    var ir = x.innenrevisionNoetig ? String(x.innenrevisionLabel || '').replace(/^Innenrevision:\s*/, '') : '-';
    html += '<tr><td>' + escapeHtml(x.typ || x.kategorie || '') + '</td><td>' + escapeHtml(x.standort || '') + '</td><td>' + fmtDate(x.letztePruefung) + '</td><td>' + fmtDate(x.naechstePruefung) + '</td>' + (mitIR ? '<td>' + escapeHtml(ir) + '</td>' : '') + '<td>' + escapeHtml(st.label) + '</td></tr>';
  });
  html += '</tbody></table>';
  html += '<div style="font-size:11px; color:#888; margin-top:16px;">Automatisch erstellter Prüfbericht aus dem Kundenportal von Wolfgang Janiba Brandschutztechnik GmbH, ersetzt keine offiziellen Prüfprotokolle.</div>';
  html += '</div>';
  document.getElementById('druckBereich').innerHTML = html;
}

function protokolliereZugriff(g){
  try {
    var schonProtokolliert = sessionStorage.getItem('protokolliert_' + g.id);
    if(schonProtokolliert) return;
    sessionStorage.setItem('protokolliert_' + g.id, '1');
  } catch(e){}
  try {
    firebase.firestore().collection('portal_zugriffe').add({
      geraetId: g.id,
      kundenname: g.kundenname || '',
      typ: g.typ || '',
      standort: g.standort || '',
      zeitpunkt: new Date().toISOString()
    }).catch(function(err){ console.error('Protokoll-Fehler', err); });
  } catch(e){}
}

function normalisiereCode(s){
  return String(s || '').trim().toLowerCase().replace(/\s+/g, '');
}

// Aus dem Code wird ein Schluessel berechnet (gleiches Verfahren wie in der App).
// Der Code selbst steht nirgends oeffentlich.
function berechneSchluessel(code, cb){
  try{
    if(!window.crypto || !window.crypto.subtle || typeof TextEncoder === 'undefined'){ cb(null); return; }
    var daten = new TextEncoder().encode('bsv-portal|' + normalisiereCode(code));
    window.crypto.subtle.digest('SHA-256', daten).then(function(buf){
      var b = new Uint8Array(buf), hex = '';
      for(var i = 0; i < b.length; i++){ hex += ('0' + b[i].toString(16)).slice(-2); }
      cb(hex);
    }).catch(function(){ cb(null); });
  }catch(e){ cb(null); }
}

function ladeGeschuetzt(schluessel, id, cb){
  if(!schluessel){ cb(null); return; }
  firebase.firestore().collection('portal').doc(schluessel).collection('geraete').doc(id).get().then(function(doc){
    cb(doc.exists ? doc.data() : null);
  }).catch(function(){ cb(null); });
}

// ---------- Treuekarte: Punktestand (nur lesen) ----------
function punkteText(n){
  var s = String(Math.abs(Math.round(n || 0))), out = '';
  while(s.length > 3){ out = '.' + s.substring(s.length - 3) + out; s = s.substring(0, s.length - 3); }
  return (n < 0 ? '-' : '') + s + out;
}
function startTreue(code){
  var k = document.querySelector('.kopf .sub');
  if(k) k.textContent = 'Ihre Treuekarte';
  try{ document.title = 'Treuekarte - Wolfgang Janiba Brandschutztechnik GmbH'; }catch(e){}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
  }catch(e){}
  berechneSchluessel('treue-' + code, function(schluessel){
    if(!schluessel){ zeigeFehler('Ihr Browser unterstützt diese Seite leider nicht.'); return; }
    firebase.firestore().collection('portal').doc(schluessel).collection('geraete').doc('treue').get().then(function(doc){
      if(!doc.exists || !doc.data().aktiv){ zeigeFehler('Diese Treuekarte ist noch nicht aktiviert. Bitte bei Ihrem nächsten Besuch vorzeigen.'); return; }
      zeigeTreue(doc.data());
    }).catch(function(err){
      console.error(err);
      zeigeFehler('Die Daten konnten nicht geladen werden. Bitte Internetverbindung prüfen und Seite neu laden.');
    });
  });
}
function zeigeTreue(t){
  var p = t.punkte || 0;
  var h = '<div class="card" style="text-align:center;">';
  h += '<div style="font-size:13px; color:#777; text-transform:uppercase; letter-spacing:1px;">Ihr Punktestand</div>';
  h += '<div style="font-size:52px; font-weight:800; color:#c23f12; line-height:1.1; margin:6px 0;">' + punkteText(p) + '</div>';
  h += '<div style="font-size:13px; color:#777;">Stand: ' + fmtDate(t.stand) + '</div>';
  h += '</div>';
  h += '<div class="card"><h2>Prämien</h2>';
  (t.praemien || []).forEach(function(pr){
    var pz = Math.max(0, Math.min(100, Math.round(p / pr.punkte * 100)));
    var ok = p >= pr.punkte;
    h += '<div style="padding:10px 0; border-bottom:1px solid #eee;">';
    h += '<div style="display:flex; align-items:baseline; gap:8px;"><div style="flex:1; font-weight:700;">' + escapeHtml(pr.name) + '</div>';
    h += '<div style="font-size:13px;' + (ok ? ' color:#1e8449; font-weight:700;' : ' color:#555;') + '">' + (ok ? 'Einlösbar!' : punkteText(p) + ' / ' + punkteText(pr.punkte)) + '</div></div>';
    h += '<div style="height:10px; border-radius:6px; background:#e6e1da; margin-top:6px; overflow:hidden;"><div style="height:100%; width:' + pz + '%; background:' + (ok ? '#1e8449' : '#c23f12') + ';"></div></div>';
    h += '</div>';
  });
  h += '</div>';
  if(t.buchungen && t.buchungen.length){
    h += '<div class="card"><h2>Letzte Buchungen</h2>';
    t.buchungen.forEach(function(b){
      h += '<div style="display:flex; gap:8px; padding:7px 0; border-bottom:1px solid #eee; font-size:14px;"><div style="flex:1;">' + fmtDate(b.d) + ' &middot; ' + escapeHtml(b.t || '') + '</div><b style="color:' + (b.p < 0 ? '#c23f12' : '#1e8449') + ';">' + (b.p > 0 ? '+' : '') + punkteText(b.p) + '</b></div>';
    });
    h += '</div>';
  }
  h += '<div class="card"><h2>So funktioniert&#39;s</h2><div style="font-size:14px; line-height:1.5;">Mit jedem Euro (netto) bei Wolfgang Janiba Brandschutztechnik sammeln Sie 10 Punkte &ndash; bei CO2-Füllungen, Überprüfungen und Neukäufen. Einfach die Karte vorzeigen. Prämien lösen wir bei Ihrem nächsten Besuch für Sie ein.</div></div>';
  document.getElementById('inhalt').innerHTML = h;
}

function start(){
  var params = new URLSearchParams(window.location.search);
  var karte = params.get('karte');
  if(karte){ startTreue(String(karte).toUpperCase()); return; }
  var id = params.get('id');
  if(!id){
    zeigeFehler('Kein Gerät angegeben. Bitte den QR-Code am Feuerlöscher erneut scannen.');
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    var db = firebase.firestore();
    db.collection('oeffentlich_geraete').doc(id).get().then(function(doc){
      if(!doc.exists){
        zeigeFehler('Für dieses Gerät sind aktuell keine Daten freigegeben. Bitte kontaktieren Sie Wolfgang Janiba Brandschutztechnik GmbH.');
        return;
      }
      var g = doc.data();
      if(g.codeNoetig || g.zugangscode){
        var gemerkt = null;
        try { gemerkt = sessionStorage.getItem('portalSchluessel'); } catch(e){}
        ladeGeschuetzt(gemerkt, id, function(voll){
          if(voll) render(voll, gemerkt);
          else zeigeZugangsAbfrage(g, id);
        });
      } else {
        render(g, null);
      }
    }).catch(function(err){
      console.error(err);
      zeigeFehler('Die Daten konnten nicht geladen werden. Bitte Internetverbindung prüfen und Seite neu laden.');
    });
  } catch(err){
    console.error(err);
    zeigeFehler('Verbindung fehlgeschlagen. Bitte Seite neu laden.');
  }
}

function zeigeZugangsAbfrage(g, id){
  var html = '<div class="card">';
  html += '<h2>Zugangscode</h2>';
  html += '<div class="meta" style="margin-top:0;">Bitte den Zugangscode eingeben, den Sie von Wolfgang Janiba Brandschutztechnik GmbH erhalten haben.</div>';
  html += '<input id="pinInput" type="text" autocapitalize="characters" autocomplete="off" placeholder="z.B. X7K2P9" style="width:100%; margin-top:14px; padding:12px; font-size:18px; text-align:center; letter-spacing:2px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;">';
  html += '<button id="pinBtn" style="width:100%; margin-top:12px; padding:12px; border:none; border-radius:8px; background:#c23f12; color:#fff; font-weight:700; font-size:15px;">Bestätigen</button>';
  html += '<div id="pinFehler" class="meta" style="color:#a3300d; margin-top:8px; display:none;">Zugangscode nicht erkannt, bitte erneut versuchen.</div>';
  html += '</div>';
  document.getElementById('inhalt').innerHTML = html;
  var input = document.getElementById('pinInput');
  var btn = document.getElementById('pinBtn');
  input.focus();
  var fehler = function(){
    btn.disabled = false; btn.textContent = 'Bestätigen';
    document.getElementById('pinFehler').style.display = 'block';
    input.value = '';
    input.focus();
  };
  var pruefen = function(){
    var eingabe = input.value;
    if(!normalisiereCode(eingabe)){ fehler(); return; }
    btn.disabled = true; btn.textContent = 'Wird geprüft ...';
    berechneSchluessel(eingabe, function(schluessel){
      ladeGeschuetzt(schluessel, id, function(voll){
        if(voll){
          try { sessionStorage.setItem('portalSchluessel', schluessel); } catch(e){}
          render(voll, schluessel);
        } else if(g.zugangscode && normalisiereCode(eingabe) === normalisiereCode(g.zugangscode)){
          // Uebergangszeit: Geraet ist noch nicht umgestellt
          render(g, null);
        } else {
          fehler();
        }
      });
    });
  };
  btn.onclick = pruefen;
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') pruefen(); });
}

start();
</script>
